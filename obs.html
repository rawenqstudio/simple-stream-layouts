<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>WIDOK OBS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", sans-serif;
      }

      #video-container {
        width: 100%;
        height: 100%;
        transition: all 0.5s ease;
        position: relative;
      }
      .video-box {
        position: relative;
        overflow: hidden;
        border: 2px solid white;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        background: #000;
        transition: all 0.5s ease;
        aspect-ratio: 16 / 9;
      }

      .video-box[data-ratio="4:3"] {
        aspect-ratio: 4 / 3;
      }

      video,
      img.fake-cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.2s ease;
      }

      .mute-icon {
        position: absolute;
        top: 10px;
        right: 10px;
        color: red;
        font-size: 24px;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 50%;
        display: none;
        z-index: 20;
      }
      .label {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 15px;
        border-radius: 4px;
        font-size: 1.2rem;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
        border-left: 4px solid #00d2ff;
        z-index: 10;
        display: none;
      }

      #video-container:not(.show-labels) .label {
        display: none !important;
      }
      #video-container:not(.show-icons) .mute-icon {
        display: none !important;
      }
      #video-container.hide-borders .video-box {
        border: none !important;
      }

      .game-card {
        position: absolute;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        background: #ffeb3b;
        color: #000;
        padding: 10px 20px;
        font-size: 2em;
        font-weight: 800;
        text-transform: uppercase;
        border-radius: 5px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        z-index: 50;
        text-align: center;
        border: 2px solid #fdd835;
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        white-space: nowrap;
      }
      .game-card.self-hidden {
        opacity: 0 !important;
        pointer-events: none;
      }
      @keyframes popIn {
        0% {
          transform: translateX(-50%) scale(0) rotate(-10deg);
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      #local-panel {
        position: absolute;
        bottom: 40px;
        right: 40px;
        background: rgba(0, 0, 0, 0.85);
        border: 3px solid #555;
        border-radius: 15px;
        padding: 30px;
        z-index: 9999;
        display: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        width: 500px;
      }
      #local-panel.visible {
        opacity: 1;
      }
      #local-panel h4 {
        color: #00d2ff;
        margin: 0 0 20px 0;
        font-size: 28px;
        text-align: center;
        text-transform: uppercase;
      }
      .local-btn-container {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #local-panel button {
        background: #444;
        color: white;
        border: 2px solid #666;
        padding: 15px 25px;
        margin: 5px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 22px;
        font-weight: bold;
        transition: 0.2s;
        flex-grow: 1;
      }
      #local-panel button:hover {
        background: #007bff;
        border-color: #00d2ff;
      }

      /* NOWOŚĆ: Klasa dla aktywnego przycisku układu */
      #local-panel button.active-layout {
        background: #007bff !important;
        border-color: #00d2ff !important;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        transform: scale(1.05);
        z-index: 2;
      }

      .layout-free {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .layout-free .video-box {
        position: absolute;
        transition:
          width 0.2s,
          height 0.2s,
          top 0.1s,
          left 0.1s;
        width: 320px;
        height: auto;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
      }

      .layout-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 15px;
        padding: 20px;
        height: 100vh;
      }
      .layout-grid .video-box {
        width: auto;
        height: 45%;
      }
      .layout-grid[data-count="1"] .video-box {
        height: 85%;
      }
      .layout-grid[data-count="2"] .video-box {
        height: 60%;
      }
      .layout-grid[data-count="3"] .video-box,
      .layout-grid[data-count="4"] .video-box {
        height: 45%;
      }
      .layout-grid[data-count="5"] .video-box,
      .layout-grid[data-count="6"] .video-box {
        height: 32%;
      }
      .layout-grid[data-count="7"] .video-box,
      .layout-grid[data-count="8"] .video-box,
      .layout-grid[data-count="9"] .video-box {
        height: 30%;
      }
      .layout-grid[data-count="10"] .video-box,
      .layout-grid[data-count="11"] .video-box,
      .layout-grid[data-count="12"] .video-box {
        height: 23%;
      }

      .layout-sidebar-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        padding-right: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-right .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-sidebar-left {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-left .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-bottom {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-bottom .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }
      .layout-top {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-top .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }
      .layout-split {
        display: grid;
        grid-template-columns: 320px 1fr 320px;
        grid-auto-rows: min-content;
        align-content: center;
        row-gap: 30px;
        padding: 20px 40px;
        height: 100vh;
      }
      .layout-split .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-split .video-box:nth-child(odd) {
        grid-column: 1;
        justify-self: start;
      }
      .layout-split .video-box:nth-child(even) {
        grid-column: 3;
        justify-self: end;
      }
      .layout-center-stage {
        display: grid;
        grid-template-columns: 300px 1fr 300px;
        grid-auto-rows: min-content;
        gap: 15px;
        padding: 20px;
        height: 100vh;
        align-content: center;
      }
      .layout-center-stage .video-box {
        width: 300px;
        height: auto;
        margin: 0;
      }
      .layout-center-stage .video-box:nth-child(1) {
        grid-column: 2;
        grid-row: 1 / span 10;
        height: 90vh;
        width: auto;
        max-width: 100%;
        align-self: center;
        justify-self: center;
        z-index: 10;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }
      .layout-center-stage .video-box:nth-child(even) {
        grid-column: 1;
      }
      .layout-center-stage .video-box:nth-child(odd):not(:first-child) {
        grid-column: 3;
      }

      /* --- NOWE STYLE: LOKALNY DRAG & DROP W OBS --- */
      .layout-free .video-box {
        cursor: grab;
      }
      .layout-free .video-box:active {
        cursor: grabbing;
        z-index: 1000;
        border-color: yellow !important;
      }

      .guide-line {
        position: absolute;
        background-color: #ff0000;
        z-index: 9999;
        display: none;
        pointer-events: none;
      }
      .guide-x {
        width: 100%;
        height: 1px;
        left: 0;
      }
      .guide-y {
        height: 100%;
        width: 1px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <!-- Linie pomocnicze wyrzucone na zewnątrz, żeby nie psuły CSS kamer! -->
    <div id="guide-x" class="guide-line guide-x"></div>
    <div id="guide-y" class="guide-line guide-y"></div>

    <div id="video-container" class="layout-grid" data-count="0"></div>
    <div id="local-panel">
      <h4>Własny Układ</h4>
      <div class="local-btn-container">
        <!-- ZMIANA: Dodano "this" oraz klasę active-layout -->
        <button
          onclick="setLocalLayout('layout-grid', this)"
          style="background: #6f42c1; width: 100%"
          class="active-layout"
        >
          🔳 Siatka
        </button>
        <button onclick="setLocalLayout('layout-top', this)">⬆️ Góra</button>
        <button onclick="setLocalLayout('layout-bottom', this)">⬇️ Dół</button>
        <button onclick="setLocalLayout('layout-sidebar-left', this)">
          ⬅️ Lewo
        </button>
        <button onclick="setLocalLayout('layout-sidebar-right', this)">
          ➡️ Prawo
        </button>
        <button
          onclick="setLocalLayout('layout-split', this)"
          style="width: 40%"
        >
          ↔️ Split
        </button>
        <button
          onclick="setLocalLayout('layout-center-stage', this)"
          style="width: 40%"
        >
          ⭐️ Center
        </button>
        <button
          onclick="toggleLocalFreeMode(this)"
          style="width: 90%; background: #28a745; margin-top: 10px"
        >
          🔓 Swobodne Ustawianie
        </button>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const myID = urlParams.get("room") || "test-room";
      const useStunOnly = urlParams.get("stunonly");
      const useULL = urlParams.get("ull");
      const isMulti = urlParams.get("multi");
      const isLocal = urlParams.get("local") === "1";
      const hideTargetName = urlParams.get("hide")
        ? urlParams.get("hide").toLowerCase().trim()
        : null;

      const selectedConfig = useStunOnly
        ? [{ urls: "stun:stun.l.google.com:19302" }]
        : [
            { urls: "stun:stun.l.google.com:19302" },
            {
              urls: "turn:openrelay.metered.ca:80?transport=udp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:80?transport=tcp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:443?transport=udp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:443?transport=tcp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
          ];

      const peer = new Peer(isMulti ? undefined : myID, {
        config: { iceServers: selectedConfig },
      });
      const container = document.getElementById("video-container");

      const guests = {};
      const heartbeats = {};
      let directorConn = null;
      const statsCache = {};
      let hidePanelTimeout;

      if (isLocal) {
        const localPanel = document.getElementById("local-panel");
        localPanel.style.display = "block";
        container.className = "layout-grid";
        const showPanel = () => {
          localPanel.classList.add("visible");
          clearTimeout(hidePanelTimeout);
          hidePanelTimeout = setTimeout(() => {
            localPanel.classList.remove("visible");
          }, 5000);
        };
        window.addEventListener("mousemove", showPanel);
        window.addEventListener("mousedown", showPanel);
      }

      let isLocalFreeMode = false;

      // NOWOŚĆ: Funkcja do aktualizacji wyglądu przycisków
      function updateLocalActiveButton(clickedBtn) {
        if (!clickedBtn) return;
        // Usuń klasę active-layout ze wszystkich przycisków w lokalnym panelu
        document
          .querySelectorAll("#local-panel button")
          .forEach((btn) => btn.classList.remove("active-layout"));
        // Nadaj klasę tylko klikniętemu
        clickedBtn.classList.add("active-layout");
      }

      function setLocalLayout(mode, btnElement) {
        isLocalFreeMode = false;
        container.className = mode;
        document.querySelectorAll(".video-box").forEach((box) => {
          box.style.top = "";
          box.style.left = "";
          box.style.width = "";
          box.style.height = "";
        });
        updateLocalActiveButton(btnElement); // Oznacz jako aktywny
      }

      function toggleLocalFreeMode(btnElement) {
        isLocalFreeMode = true;
        container.className = "layout-free";

        const boxes = document.querySelectorAll(".video-box");
        boxes.forEach((box, index) => {
          if (!box.style.left) {
            box.style.width = "320px";
            box.style.height = "auto";
            box.style.left = 2 + index * 5 + "%";
            box.style.top = 2 + index * 5 + "%";
          }
        });
        updateLocalActiveButton(btnElement); // Oznacz jako aktywny
        console.log("🛠️ Tryb swobodny w OBS włączony.");
      }

      // --- LOGIKA DRAG & DROP Z MAGNETYZMEM W OBS ---
      let obsDraggedEl = null;
      let obsStartX, obsStartY;
      let obsStartLeftPct, obsStartTopPct;

      document.addEventListener("mousedown", (e) => {
        if (!isLocalFreeMode) return;

        const box = e.target.closest(".video-box");
        if (!box) return;

        obsDraggedEl = box;
        obsStartX = e.clientX;
        obsStartY = e.clientY;

        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        obsStartLeftPct = parseFloat(obsDraggedEl.style.left) || 0;
        obsStartTopPct = parseFloat(obsDraggedEl.style.top) || 0;

        if (!obsDraggedEl.style.left.includes("%")) {
          obsStartLeftPct = (obsDraggedEl.offsetLeft / stageW) * 100;
          obsStartTopPct = (obsDraggedEl.offsetTop / stageH) * 100;
        }

        obsDraggedEl.style.zIndex = 1000;
      });

      document.addEventListener("mousemove", (e) => {
        if (!obsDraggedEl || !isLocalFreeMode) return;

        const isAltPressed = e.altKey;
        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        const deltaX = e.clientX - obsStartX;
        const deltaY = e.clientY - obsStartY;

        const deltaXPct = (deltaX / stageW) * 100;
        const deltaYPct = (deltaY / stageH) * 100;

        let newX = obsStartLeftPct + deltaXPct;
        let newY = obsStartTopPct + deltaYPct;

        const myW = (obsDraggedEl.offsetWidth / stageW) * 100;
        const myH = (obsDraggedEl.offsetHeight / stageH) * 100;

        const guideX = document.getElementById("guide-x");
        const guideY = document.getElementById("guide-y");
        let snappedX = false;
        let snappedY = false;

        // MAGNETYZM (SNAPPING)
        if (!isAltPressed) {
          const SNAP = 1.5; // Zasięg przyciągania w %
          const others = Array.from(
            document.querySelectorAll(".video-box"),
          ).filter((b) => b !== obsDraggedEl);

          for (const other of others) {
            const oX = (other.offsetLeft / stageW) * 100;
            const oY = (other.offsetTop / stageH) * 100;
            const oW = (other.offsetWidth / stageW) * 100;
            const oH = (other.offsetHeight / stageH) * 100;

            if (Math.abs(newX - oX) < SNAP) {
              newX = oX;
              snappedX = true;
            }
            if (Math.abs(newX - (oX + oW)) < SNAP) {
              newX = oX + oW;
              snappedX = true;
            }
            if (Math.abs(newX + myW - oX) < SNAP) {
              newX = oX - myW;
              snappedX = true;
            }
            if (Math.abs(newX + myW - (oX + oW)) < SNAP) {
              newX = oX + oW - myW;
              snappedX = true;
            }

            if (Math.abs(newY - oY) < SNAP) {
              newY = oY;
              snappedY = true;
            }
            if (Math.abs(newY - (oY + oH)) < SNAP) {
              newY = oY + oH;
              snappedY = true;
            }
            if (Math.abs(newY + myH - oY) < SNAP) {
              newY = oY - myH;
              snappedY = true;
            }
            if (Math.abs(newY + myH - (oY + oH)) < SNAP) {
              newY = oY + oH - myH;
              snappedY = true;
            }
          }
        }

        if (snappedX) {
          guideX.style.display = "block";
          guideX.style.left = (newX * stageW) / 100 + "px";
        } else guideX.style.display = "none";
        if (snappedY) {
          guideY.style.display = "block";
          guideY.style.top = (newY * stageH) / 100 + "px";
        } else guideY.style.display = "none";

        // Blokada krawędzi ekranu
        newX = Math.max(0, Math.min(newX, 100 - myW));
        newY = Math.max(0, Math.min(newY, 100 - myH));

        obsDraggedEl.style.left = newX + "%";
        obsDraggedEl.style.top = newY + "%";
      });

      document.addEventListener("mouseup", () => {
        if (obsDraggedEl) {
          obsDraggedEl.style.zIndex = "";
          obsDraggedEl = null;
          document.getElementById("guide-x").style.display = "none";
          document.getElementById("guide-y").style.display = "none";
        }
      });

      peer.on("open", (id) => {
        if (isMulti) connectToDirector(myID);
      });

      function connectToDirector(targetId) {
        directorConn = peer.connect(targetId);
        directorConn.on("open", () => {
          directorConn.send({ type: "register-obs" });
        });
        directorConn.on("data", (data) => handleData(data));
      }

      peer.on("call", (call) => {
        call.answer();
        // INICJALIZACJA STANU W OBS
        if (!guests[call.peer])
          guests[call.peer] = {
            name: "Łączenie...",
            muted: false,
            mirrored: false,
            transform: { z: 1, x: 0, y: 0 },
            ratio: "16:9",
            conn: null,
          };
        guests[call.peer].call = call;
        if (useULL) {
          setTimeout(() => {
            const pc = call.peerConnection;
            if (pc && pc.getReceivers) {
              pc.getReceivers().forEach((receiver) => {
                if (
                  receiver.track &&
                  receiver.track.kind === "video" &&
                  "playoutDelayHint" in receiver
                ) {
                  receiver.playoutDelayHint = 0;
                }
              });
            }
          }, 500);
        }
        call.on("stream", (stream) => addVideo(stream, call.peer));
        call.on("close", () => removeGuest(call.peer));
        call.on("error", () => removeGuest(call.peer));
        call.peerConnection.oniceconnectionstatechange = () => {
          const s = call.peerConnection.iceConnectionState;
          if (s === "disconnected" || s === "failed" || s === "closed")
            removeGuest(call.peer);
        };
      });

      peer.on("connection", (conn) => {
        conn.on("data", (data) => {
          if (data.type === "director-hello") {
            directorConn = conn;
            sendGuestListToDirector();
          }
          handleData(data, conn);
        });
        conn.on("close", () => removeGuest(conn.peer));
        conn.on("error", () => removeGuest(conn.peer));
      });

      // --- ZRYKOWANA I NAPRAWIONA FUNKCJA STYLIZACJI (PTZ + LUSTRO + 4:3) ---
      function applyVideoStyle(id) {
        const guest = guests[id];
        const box = document.getElementById(`box-${id}`);
        if (box && guest) {
          const video = box.querySelector("video") || box.querySelector("img");
          if (video) {
            const z = guest.transform ? guest.transform.z : 1;
            const x = guest.transform ? guest.transform.x : 0;
            const y = guest.transform ? guest.transform.y : 0;

            const scaleX = guest.mirrored ? -z : z;
            const translateX = guest.mirrored ? -x : x;

            video.style.transform = `scale(${scaleX}, ${z}) translate(${translateX}%, ${y}%)`;
          }
          box.setAttribute("data-ratio", guest.ratio || "16:9");
        }
      }

      function handleData(data, conn) {
        if (data.type === "layout" && !isLocal) {
          const classesToRemove = [];
          container.classList.forEach((c) => {
            if (c.startsWith("layout-")) classesToRemove.push(c);
          });
          classesToRemove.forEach((c) => container.classList.remove(c));
          container.classList.add(data.mode);
          if (data.mode !== "layout-free") {
            document.querySelectorAll(".video-box").forEach((box) => {
              box.style.top = "";
              box.style.left = "";
              box.style.width = "";
              box.style.height = "";
            });
          }
        }
        if (data.type === "transform-update" && !isLocal) {
          const box = document.getElementById(`box-${data.targetId}`);
          if (box) {
            box.style.left = data.x + "%";
            box.style.top = data.y + "%";
            box.style.width = data.w + "%";
            box.style.height = data.h + "%";
          }
        }
        if (data.type === "reorder-guests" && !isLocal) {
          data.order.forEach((id) => {
            const box = document.getElementById(`box-${id}`);
            if (box) container.appendChild(box);
          });
        }
        if (data.type === "toggle-labels") {
          if (data.show) container.classList.add("show-labels");
          else container.classList.remove("show-labels");
        }
        if (data.type === "toggle-icons") {
          if (data.show) container.classList.add("show-icons");
          else container.classList.remove("show-icons");
        }
        if (data.type === "toggle-borders") {
          if (data.show) container.classList.remove("hide-borders");
          else container.classList.add("hide-borders");
        }

        if (data.type === "add-fake-guest")
          addFakeVideo(data.id, data.name, data.img);
        if (data.type === "refresh-cam") {
          if (data.targetId === "all")
            Object.keys(guests).forEach((id) => performRefresh(id));
          else performRefresh(data.targetId);
        }

        // --- ODBIÓR LUSTRA ---
        if (data.type === "toggle-mirror") {
          if (guests[data.targetId]) {
            guests[data.targetId].mirrored = !guests[data.targetId].mirrored;
            applyVideoStyle(data.targetId);
            sendGuestListToDirector();
          }
        }

        // --- ODBIÓR KADROWANIA (PTZ) ---
        if (data.type === "guest-cam-transform") {
          // Jeśli komenda przychodzi z Reżysera (w trybie Multi, targetId jest ustawione)
          // lub bezpośrednio od gościa (w trybie Standard, targetId może nie być, więc bierzemy conn.peer)
          const peerId = data.targetId || (conn ? conn.peer : null);
          if (peerId && guests[peerId]) {
            guests[peerId].transform = data.transform;
            applyVideoStyle(peerId); // Aktualizujemy obrazek!
          }
        }

        // GRA
        if (data.type === "game-deal") {
          document.querySelectorAll(".game-card").forEach((el) => el.remove());
          for (const [id, word] of Object.entries(data.cards)) {
            setGameCard(id, word);
          }
        }
        if (data.type === "game-update-card") {
          setGameCard(data.targetId, data.word);
        }
        if (data.type === "game-clear") {
          document.querySelectorAll(".game-card").forEach((el) => el.remove());
        }
        if (data.type === "remote-mute") {
          if (guests[data.targetId] && guests[data.targetId].conn) {
            guests[data.targetId].conn.send({
              type: "mute-cmd",
              state: data.state,
            });
          }
        }

        if (data.type === "identify") {
          // W trybie Multi odbieramy targetId od Reżysera, w Standard bierzemy ID nadawcy
          const peerId = data.targetId || (conn ? conn.peer : null);
          if (!peerId) return;

          if (!guests[peerId])
            guests[peerId] = {
              name: "Gość",
              muted: false,
              mirrored: false,
              transform: { z: 1, x: 0, y: 0 },
              ratio: "16:9",
            };
          guests[peerId].name = data.name || "Gość";
          guests[peerId].ratio = data.ratio || "16:9";

          // Przypisanie połączenia tylko w trybie Standard
          if (!isMulti && conn) guests[peerId].conn = conn;

          updateLabel(peerId, data.name);

          const box = document.getElementById(`box-${peerId}`);
          if (box) {
            box.setAttribute("data-ratio", guests[peerId].ratio); // Aplikuje CSS 4:3 / 16:9
            const card = box.querySelector(".game-card");
            if (
              card &&
              hideTargetName &&
              data.name.toLowerCase().trim() === hideTargetName
            ) {
              card.classList.add("self-hidden");
            }
          }

          // Tylko w trybie standardowym (P2P bezpośrednio do Gościa) odsyłamy listę
          if (!isMulti) sendGuestListToDirector();

          applyVideoStyle(peerId);
        }
        if (data.type === "mic-status" && conn) {
          if (guests[conn.peer]) {
            guests[conn.peer].muted = data.muted;
            toggleMuteIcon(conn.peer, data.muted);
            sendGuestListToDirector();
          }
        }
        if (data.type === "heartbeat" && conn)
          heartbeats[conn.peer] = Date.now();
        if (data.type === "leave" && conn) removeGuest(conn.peer);
      }

      function setGameCard(id, word) {
        const box = document.getElementById(`box-${id}`);
        if (!box) return;
        let oldCard = box.querySelector(".game-card");
        if (oldCard) oldCard.remove();
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerText = word;
        if (hideTargetName && guests[id] && guests[id].name) {
          if (guests[id].name.toLowerCase().trim() === hideTargetName) {
            card.classList.add("self-hidden");
          }
        }
        box.appendChild(card);
      }
      function updateGuestCount() {
        const count = container.querySelectorAll(".video-box").length;
        container.setAttribute("data-count", count);
      }

      setInterval(async () => {
        const now = Date.now();
        const statsReport = {};
        for (const peerId in guests) {
          if (peerId.startsWith("fake-")) continue;
          if (heartbeats[peerId] && now - heartbeats[peerId] > 7000) {
            removeGuest(peerId);
            continue;
          }
          const guest = guests[peerId];
          if (guest.call && guest.call.peerConnection) {
            try {
              const stats = await guest.call.peerConnection.getStats();
              let videoStats = null;
              stats.forEach((report) => {
                if (report.type === "inbound-rtp" && report.kind === "video")
                  videoStats = report;
              });
              if (videoStats) {
                const bytes = videoStats.bytesReceived;
                const prevBytes = statsCache[peerId]?.bytes || 0;
                const bitrate = ((bytes - prevBytes) * 8) / 1000;
                const jitterBufferDelay = videoStats.jitterBufferDelay || 0;
                const jitterBufferEmitted =
                  videoStats.jitterBufferEmittedCount || 1;
                const prevDelayTotal = statsCache[peerId]?.delayTotal || 0;
                const prevEmittedTotal = statsCache[peerId]?.emittedTotal || 0;
                const deltaDelay = jitterBufferDelay - prevDelayTotal;
                const deltaEmitted = jitterBufferEmitted - prevEmittedTotal;
                let currentLatency = 0;
                if (deltaEmitted > 0)
                  currentLatency = deltaDelay / deltaEmitted;
                const box = document.getElementById(`box-${peerId}`);
                if (box) {
                  const video = box.querySelector("video");
                  if (video && !video.paused) {
                    if (currentLatency > 0.2) {
                      if (video.playbackRate !== 1.05)
                        video.playbackRate = 1.05;
                    } else if (currentLatency < 0.15) {
                      if (video.playbackRate !== 1.0) video.playbackRate = 1.0;
                    }
                    if (currentLatency > 2.0) performRefresh(peerId);
                  }
                }
                statsCache[peerId] = {
                  bytes: bytes,
                  delayTotal: jitterBufferDelay,
                  emittedTotal: jitterBufferEmitted,
                };
                statsReport[peerId] = {
                  bitrate: Math.round(bitrate),
                  packetLoss: videoStats.packetsLost || 0,
                  resolution:
                    videoStats.frameWidth && videoStats.frameHeight
                      ? `${videoStats.frameWidth}x${videoStats.frameHeight}`
                      : "N/A",
                };
              }
            } catch (e) {}
          }
        }
        if (
          directorConn &&
          directorConn.open &&
          Object.keys(statsReport).length > 0
        ) {
          directorConn.send({ type: "stats-update", stats: statsReport });
        }
      }, 1000);

      function addFakeVideo(id, name, imgSrc) {
        if (document.getElementById(`box-${id}`)) return;
        guests[id] = {
          name: name,
          muted: false,
          mirrored: false,
          transform: { z: 1, x: 0, y: 0 },
          ratio: "16:9",
          conn: null,
        };
        const box = document.createElement("div");
        box.className = "video-box";
        box.id = `box-${id}`;
        box.style.order = 999;
        const img = document.createElement("img");
        img.src = imgSrc;
        img.className = "fake-cam";
        const label = document.createElement("div");
        label.className = "label";
        label.id = `label-${id}`;
        label.innerText = name;
        const muteIcon = document.createElement("div");
        muteIcon.className = "mute-icon";
        muteIcon.innerText = "🔇";
        muteIcon.id = `mute-${id}`;
        box.appendChild(img);
        box.appendChild(label);
        box.appendChild(muteIcon);
        container.appendChild(box);
        updateGuestCount();
        sendGuestListToDirector();
        applyVideoStyle(id);
      }

      function addVideo(stream, id) {
        if (document.getElementById(`box-${id}`)) return;
        heartbeats[id] = Date.now();
        statsCache[id] = { bytes: 0, delayTotal: 0, emittedTotal: 0 };
        if (!guests[id])
          guests[id] = {
            name: "Gość",
            muted: false,
            mirrored: false,
            transform: { z: 1, x: 0, y: 0 },
            ratio: "16:9",
          };

        const box = document.createElement("div");
        box.className = "video-box";
        box.id = `box-${id}`;
        box.style.order = 999;
        const video = document.createElement("video");
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;
        const audio = document.createElement("audio");
        audio.srcObject = stream;
        audio.muted = false;
        audio.autoplay = true;
        audio.id = `audio-${id}`;
        const label = document.createElement("div");
        label.className = "label";
        label.id = `label-${id}`;
        const muteIcon = document.createElement("div");
        muteIcon.className = "mute-icon";
        muteIcon.innerText = "🔇";
        muteIcon.id = `mute-${id}`;
        box.appendChild(video);
        box.appendChild(label);
        box.appendChild(muteIcon);
        box.appendChild(audio);
        container.appendChild(box);

        updateGuestCount();
        applyVideoStyle(id);

        video.play().catch((e) => console.error(e));
        audio.play().catch((e) => console.warn(e));
      }

      function performRefresh(id) {
        const box = document.getElementById(`box-${id}`);
        if (!box) return;
        const video = box.querySelector("video");
        const audio = box.querySelector("audio");
        if (video && video.srcObject) {
          const stream = video.srcObject;
          video.srcObject = null;
          if (audio) audio.srcObject = null;
          setTimeout(() => {
            video.srcObject = stream;
            if (audio) audio.srcObject = stream;
            video.play().catch((e) => console.log(e));
            if (audio) audio.play().catch((e) => console.log(e));
          }, 100);
        }
      }
      function removeGuest(id) {
        if (document.getElementById(`box-${id}`)) {
          document.getElementById(`box-${id}`).remove();
          delete guests[id];
          delete heartbeats[id];
          delete statsCache[id];
          updateGuestCount();
          sendGuestListToDirector();
        }
      }
      function updateLabel(id, name) {
        const label = document.getElementById(`label-${id}`);
        if (label) {
          if (name && name.trim() !== "") {
            label.innerText = name;
            label.style.display = "block";
          } else {
            label.style.display = "none";
          }
        }
      }
      function toggleMuteIcon(id, isMuted) {
        const icon = document.getElementById(`mute-${id}`);
        if (icon) icon.style.display = isMuted ? "block" : "none";
      }
      function sendGuestListToDirector() {
        if (directorConn && directorConn.open) {
          const safeList = Object.keys(guests).map((id) => ({
            id: id,
            name: guests[id].name,
            muted: guests[id].muted,
            mirrored: guests[id].mirrored,
            ratio: guests[id].ratio,
          }));
          directorConn.send({ type: "guest-list", list: safeList });
        }
      }
    </script>
  </body>
</html>
