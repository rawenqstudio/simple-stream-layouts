<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>WIDOK OBS - Simple Stream Layouts</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent-sky: #38bdf8;
        --accent-rose: #f43f5e;
      }

      * {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }

      #video-container {
        width: 100%;
        height: 100%;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      .video-box {
        position: relative;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        background: #000;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        aspect-ratio: 16 / 9;
      }
      .video-box[data-ratio="4:3"] {
        aspect-ratio: 4 / 3 !important;
      }

      video,
      img.fake-cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.2s ease;
      }

      .mute-icon {
        position: absolute;
        top: 12px;
        right: 12px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        background: rgba(244, 63, 94, 0.9);
        backdrop-filter: blur(8px);
        padding: 5px 10px;
        border-radius: 6px;
        display: none;
        z-index: 20;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }

      .label {
        position: absolute;
        bottom: 12px;
        left: 12px;
        background: rgba(9, 11, 16, 0.85);
        backdrop-filter: blur(10px);
        color: #f8fafc;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 1.15rem;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 4px solid var(--accent-sky);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        z-index: 10;
        display: none;
      }

      #video-container:not(.show-labels) .label {
        display: none !important;
      }
      #video-container:not(.show-icons) .mute-icon {
        display: none !important;
      }
      #video-container.hide-borders .video-box {
        border: none !important;
      }

      /* KARTY GRY (CZÓŁKO) */
      .game-card {
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #fde047, #eab308);
        color: #000;
        padding: 8px 24px;
        font-size: 1.9em;
        font-weight: 800;
        text-transform: uppercase;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        z-index: 50;
        text-align: center;
        border: 2px solid rgba(255, 255, 255, 0.8);
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        white-space: nowrap;
      }
      .game-card.self-hidden {
        opacity: 0 !important;
        pointer-events: none;
      }
      @keyframes popIn {
        0% {
          transform: translateX(-50%) scale(0) rotate(-10deg);
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      /* --- LOKALNY PANEL W OBS (&local=1) --- */
      #local-panel {
        position: absolute;
        bottom: 30px;
        right: 30px;
        background: rgba(14, 18, 28, 0.88);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 24px;
        z-index: 9999;
        display: none;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        width: 440px;
      }
      #local-panel.visible {
        opacity: 1;
      }
      #local-panel h4 {
        color: var(--accent-sky);
        margin: 0 0 16px 0;
        font-size: 18px;
        font-weight: 800;
        text-align: center;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .local-btn-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      #local-panel button {
        background: rgba(255, 255, 255, 0.05);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        transition: all 0.15s ease;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      #local-panel button:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.25);
      }
      #local-panel button.active-layout {
        background: rgba(56, 189, 248, 0.2) !important;
        border-color: var(--accent-sky) !important;
        color: #fff;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      }

      /* --- UKŁADY --- */
      .layout-free {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .layout-free .video-box {
        position: absolute;
        transition:
          width 0.2s,
          height 0.2s,
          top 0.1s,
          left 0.1s;
        width: 320px;
        height: auto;
        aspect-ratio: auto !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
      }

      .box-fit-btn-group {
        position: absolute;
        top: 8px;
        left: 8px;
        display: none;
        gap: 4px;
        z-index: 30;
      }
      .layout-free .video-box[data-ratio="4:3"] .box-fit-btn-group {
        display: flex;
      }
      .btn-fit-obs {
        background: rgba(9, 11, 16, 0.85);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #f8fafc;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
        line-height: 1;
        font-family: inherit;
      }
      .btn-fit-obs:hover {
        background: var(--accent-sky, #38bdf8);
        border-color: var(--accent-sky, #38bdf8);
        color: #000;
      }
      .layout-free .video-box:active {
        cursor: grabbing;
        z-index: 1000;
        border-color: var(--accent-sky) !important;
      }

      .layout-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 15px;
        padding: 20px;
        height: 100vh;
      }
      .layout-grid .video-box {
        width: auto;
        height: 45%;
      }
      .layout-grid[data-count="1"] .video-box {
        height: 85%;
      }
      .layout-grid[data-count="2"] .video-box {
        height: 60%;
      }
      .layout-grid[data-count="3"] .video-box,
      .layout-grid[data-count="4"] .video-box {
        height: 45%;
      }
      .layout-grid[data-count="5"] .video-box,
      .layout-grid[data-count="6"] .video-box {
        height: 32%;
      }
      .layout-grid[data-count="7"] .video-box,
      .layout-grid[data-count="8"] .video-box,
      .layout-grid[data-count="9"] .video-box {
        height: 30%;
      }
      .layout-grid[data-count="10"] .video-box,
      .layout-grid[data-count="11"] .video-box,
      .layout-grid[data-count="12"] .video-box {
        height: 23%;
      }

      .layout-sidebar-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        padding-right: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-right .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }

      .layout-sidebar-left {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-left .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }

      .layout-bottom {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-bottom .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }

      .layout-top {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-top .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }

      .layout-split {
        display: grid;
        grid-template-columns: 320px 1fr 320px;
        grid-auto-rows: min-content;
        align-content: center;
        row-gap: 30px;
        padding: 20px 40px;
        height: 100vh;
      }
      .layout-split .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-split .video-box:nth-child(2n + 1) {
        grid-column: 1;
        justify-self: start;
      }
      .layout-split .video-box:nth-child(2n) {
        grid-column: 3;
        justify-self: end;
      }

      .layout-center-stage {
        display: grid;
        grid-template-columns: 300px 1fr 300px;
        grid-auto-rows: min-content;
        gap: 15px;
        padding: 20px;
        height: 100vh;
        align-content: center;
      }
      .layout-center-stage .video-box {
        width: 300px;
        height: auto;
        margin: 0;
      }
      .layout-center-stage .video-box:first-child {
        grid-column: 2;
        grid-row: 1 / span 10;
        height: 90vh;
        width: auto;
        max-width: 100%;
        align-self: center;
        justify-self: center;
        z-index: 10;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      }
      .layout-center-stage .video-box:nth-child(2n) {
        grid-column: 1;
      }
      .layout-center-stage .video-box:nth-child(odd):not(:first-child) {
        grid-column: 3;
      }

      .guide-line {
        position: absolute;
        background-color: var(--accent-rose);
        z-index: 9999;
        display: none;
        pointer-events: none;
      }
      .guide-x {
        width: 100%;
        height: 1px;
        left: 0;
      }
      .guide-y {
        height: 100%;
        width: 1px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="guide-x" class="guide-line guide-x"></div>
    <div id="guide-y" class="guide-line guide-y"></div>

    <!-- NIEWIDZIALNY KONTENER NA WYKLUCZONYCH GOŚCI (Mix-Minus) -->
    <div id="hidden-container" style="display: none"></div>

    <div id="video-container" class="layout-grid" data-count="0"></div>

    <div id="local-panel">
      <h4>Własny Układ Ekranu</h4>
      <div class="local-btn-container">
        <button
          onclick="setLocalLayout('layout-grid', this)"
          style="grid-column: span 2"
          class="active-layout"
        >
          🔳 Pełna Siatka
        </button>
        <button onclick="setLocalLayout('layout-top', this)">⬆️ Góra</button>
        <button onclick="setLocalLayout('layout-bottom', this)">⬇️ Dół</button>
        <button onclick="setLocalLayout('layout-sidebar-left', this)">
          ⬅️ Lewo
        </button>
        <button onclick="setLocalLayout('layout-sidebar-right', this)">
          ➡️ Prawo
        </button>
        <button onclick="setLocalLayout('layout-split', this)">↔️ Split</button>
        <button onclick="setLocalLayout('layout-center-stage', this)">
          ⭐️ Center
        </button>
        <button
          onclick="toggleLocalFreeMode(this)"
          style="
            grid-column: span 2;
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
          "
        >
          🔓 Swobodne Ustawianie
        </button>
      </div>
    </div>

    <script>
      // --- INICJALIZACJA I PARAMETRY ---
      const urlParams = new URLSearchParams(window.location.search);
      const myID = urlParams.get("room") || "test-room";
      const useStunOnly = urlParams.get("stunonly");
      const useULL = urlParams.get("ull");
      const isMulti = urlParams.get("multi");
      const isLocal = urlParams.get("local") === "1";

      const hideTargetName = urlParams.get("hide")
        ? urlParams.get("hide").toLowerCase().trim()
        : null;

      // NOWOŚĆ: Cel do całkowitego ukrycia (Mix-Minus)
      const excludeTargetName = urlParams.get("exclude")
        ? urlParams.get("exclude").toLowerCase().trim()
        : null;

      const selectedConfig = useStunOnly
        ? [{ urls: "stun:stun.l.google.com:19302" }]
        : [
            { urls: "stun:stun.l.google.com:19302" },
            {
              urls: "turn:openrelay.metered.ca:80?transport=udp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:80?transport=tcp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:443?transport=udp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
            {
              urls: "turn:openrelay.metered.ca:443?transport=tcp",
              username: "openrelayproject",
              credential: "openrelayproject",
            },
          ];

      const peer = new Peer(isMulti ? undefined : myID, {
        config: { iceServers: selectedConfig },
      });

      const container = document.getElementById("video-container");
      const hiddenContainer = document.getElementById("hidden-container");

      const guests = {};
      const heartbeats = {};
      let directorConn = null;
      const statsCache = {};
      const transformsCache = {};
      let hidePanelTimeout;
      let isLocalFreeMode = false;

      // --- LOKALNY PANEL STEROWANIA ---
      if (isLocal) {
        const panel = document.getElementById("local-panel");
        panel.style.display = "block";
        container.className = "layout-grid";

        const hidePanel = () => {
          clearTimeout(hidePanelTimeout);
          panel.classList.remove("visible");
        };

        const showPanel = () => {
          panel.classList.add("visible");
          clearTimeout(hidePanelTimeout);
          hidePanelTimeout = setTimeout(hidePanel, 5000);
        };

        window.addEventListener("mousemove", showPanel);
        window.addEventListener("mousedown", showPanel);

        // Natychmiastowe zamykanie po zamknięciu okna interakcji w OBS
        window.addEventListener("blur", hidePanel);
        document.addEventListener("mouseleave", hidePanel);
      }

      function updateLocalActiveButton(btn) {
        if (!btn) return;
        document
          .querySelectorAll("#local-panel button")
          .forEach((b) => b.classList.remove("active-layout"));
        btn.classList.add("active-layout");
      }

      function applyPresetToLocalFreeMode(mode) {
        const boxes = Array.from(container.querySelectorAll(".video-box"));
        const o = boxes.length;
        if (0 === o) return;

        const pxToW = (px) => (px / 1920) * 100;
        const pxToH = (px) => (px / 1080) * 100;
        const gap = pxToW(15);
        const coords = {};

        const getBoxW = (boxEl, hPct) => {
          const id = boxEl.id.replace("box-", "");
          const is4x3 =
            (guests[id]?.ratio || boxEl.getAttribute("data-ratio")) === "4:3";
          const R = is4x3 ? 4 / 3 : 16 / 9;
          return hPct * R * 0.5625;
        };

        const getBoxH = (boxEl, wPx) => {
          const id = boxEl.id.replace("box-", "");
          const is4x3 =
            (guests[id]?.ratio || boxEl.getAttribute("data-ratio")) === "4:3";
          const hPx = is4x3 ? wPx * (3 / 4) : wPx * (9 / 16);
          return pxToH(hPx);
        };

        if ("layout-grid" === mode) {
          const cols = Math.ceil(Math.sqrt(o));
          const rows = Math.ceil(o / cols);
          let cellW =
            1 === o ? 85 : 2 === o ? 48 : o <= 4 ? 45 : o <= 9 ? 32 : 23;
          let cellH =
            1 === o ? 85 : 2 === o ? 60 : o <= 6 ? 45 : o <= 9 ? 30 : 23;

          const totalGridW = cellW * cols + gap * (cols - 1);
          const totalGridH = cellH * rows + pxToH(15) * (rows - 1);
          const startX = (100 - totalGridW) / 2;
          const startY = (100 - totalGridH) / 2;

          boxes.forEach((box, idx) => {
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const itemsInRow = (row === rows - 1 && o % cols) || cols;
            const rowStartX =
              startX +
              (totalGridW - (cellW * itemsInRow + gap * (itemsInRow - 1))) / 2;

            const cellX = rowStartX + col * (cellW + gap);
            const cellY = startY + row * (cellH + pxToH(15));
            const w = getBoxW(box, cellH);
            const offsetX = (cellW - w) / 2;

            coords[box.id] = {
              x: cellX + offsetX,
              y: cellY,
              w: w,
              h: cellH,
            };
          });
        } else if ("layout-sidebar-right" === mode) {
          const baseW = pxToW(320);
          const vGap = pxToH(15);
          const heights = boxes.map((box) => getBoxH(box, 320));
          const totalH =
            heights.reduce((sum, val) => sum + val, 0) + (o - 1) * vGap;
          let curY = Math.max(pxToH(20), (100 - totalH) / 2);

          boxes.forEach((box, idx) => {
            const h = heights[idx];
            coords[box.id] = {
              x: 100 - baseW - pxToW(20),
              y: curY,
              w: baseW,
              h: h,
            };
            curY += h + vGap;
          });
        } else if ("layout-sidebar-left" === mode) {
          const baseW = pxToW(320);
          const vGap = pxToH(15);
          const heights = boxes.map((box) => getBoxH(box, 320));
          const totalH =
            heights.reduce((sum, val) => sum + val, 0) + (o - 1) * vGap;
          let curY = Math.max(pxToH(20), (100 - totalH) / 2);

          boxes.forEach((box, idx) => {
            const h = heights[idx];
            coords[box.id] = {
              x: pxToW(20),
              y: curY,
              w: baseW,
              h: h,
            };
            curY += h + vGap;
          });
        } else if ("layout-bottom" === mode) {
          const baseH = pxToH(157);
          const hGap = pxToW(20);
          const widths = boxes.map((box) => getBoxW(box, baseH));
          const totalW =
            widths.reduce((sum, val) => sum + val, 0) + (o - 1) * hGap;
          let curX = Math.max(0, (100 - totalW) / 2);

          boxes.forEach((box, idx) => {
            const w = widths[idx];
            coords[box.id] = {
              x: curX,
              y: 100 - baseH - pxToH(20),
              w: w,
              h: baseH,
            };
            curX += w + hGap;
          });
        } else if ("layout-top" === mode) {
          const baseH = pxToH(157);
          const hGap = pxToW(20);
          const widths = boxes.map((box) => getBoxW(box, baseH));
          const totalW =
            widths.reduce((sum, val) => sum + val, 0) + (o - 1) * hGap;
          let curX = Math.max(0, (100 - totalW) / 2);

          boxes.forEach((box, idx) => {
            const w = widths[idx];
            coords[box.id] = {
              x: curX,
              y: pxToH(20),
              w: w,
              h: baseH,
            };
            curX += w + hGap;
          });
        } else if ("layout-split" === mode) {
          const baseW = pxToW(320);
          const vGap = pxToH(30);
          const leftX = pxToW(40);
          const rightX = 100 - pxToW(40) - baseW;
          const rows = Math.ceil(o / 2);

          const rowHeights = [];
          for (let r = 0; r < rows; r++) {
            const bLeft = boxes[r * 2];
            const bRight = boxes[r * 2 + 1];
            const hL = bLeft ? getBoxH(bLeft, 320) : 0;
            const hR = bRight ? getBoxH(bRight, 320) : 0;
            rowHeights.push(Math.max(hL, hR));
          }

          const totalH =
            rowHeights.reduce((sum, val) => sum + val, 0) + (rows - 1) * vGap;
          let curRowY = Math.max(pxToH(20), (100 - totalH) / 2);

          for (let r = 0; r < rows; r++) {
            const bLeft = boxes[r * 2];
            const bRight = boxes[r * 2 + 1];
            const rowH = rowHeights[r];

            if (bLeft) {
              coords[bLeft.id] = {
                x: leftX,
                y: curRowY,
                w: baseW,
                h: getBoxH(bLeft, 320),
              };
            }
            if (bRight) {
              coords[bRight.id] = {
                x: rightX,
                y: curRowY,
                w: baseW,
                h: getBoxH(bRight, 320),
              };
            }
            curRowY += rowH + vGap;
          }
        } else if ("layout-center-stage" === mode) {
          if (1 === o) {
            const mainH = 85;
            const mainW = getBoxW(boxes[0], mainH);
            coords[boxes[0].id] = {
              x: (100 - mainW) / 2,
              y: (100 - mainH) / 2,
              w: mainW,
              h: mainH,
            };
          } else {
            const sideColW = pxToW(300);
            const marginSide = pxToW(20);
            const gapCenter = pxToW(20);
            const sideGap = pxToH(15);

            const availCenterW =
              100 - 2 * marginSide - 2 * sideColW - 2 * gapCenter;
            const maxCenterH = 80;

            const id0 = boxes[0].id.replace("box-", "");
            const is4x3Main =
              (guests[id0]?.ratio || boxes[0].getAttribute("data-ratio")) ===
              "4:3";
            const R_main = is4x3Main ? 4 / 3 : 16 / 9;

            let mainH = availCenterW / (R_main * 0.5625);
            if (mainH > maxCenterH) mainH = maxCenterH;
            const mainW = mainH * R_main * 0.5625;

            const sideCount = o - 1;
            const sideRows = Math.ceil(sideCount / 2);

            const sideRowHeights = [];
            for (let r = 0; r < sideRows; r++) {
              const bL = boxes[1 + r * 2];
              const bR = boxes[2 + r * 2];
              const hL = bL ? getBoxH(bL, 300) : 0;
              const hR = bR ? getBoxH(bR, 300) : 0;
              sideRowHeights.push(Math.max(hL, hR));
            }

            const totalSideH =
              sideRowHeights.reduce((sum, val) => sum + val, 0) +
              (sideRows - 1) * sideGap;
            const sideStartY = Math.max(pxToH(20), (100 - totalSideH) / 2);

            coords[boxes[0].id] = {
              x: (100 - mainW) / 2,
              y: (100 - mainH) / 2,
              w: mainW,
              h: mainH,
            };

            let curSideY = sideStartY;
            for (let r = 0; r < sideRows; r++) {
              const bL = boxes[1 + r * 2];
              const bR = boxes[2 + r * 2];
              const rowH = sideRowHeights[r];

              if (bL) {
                coords[bL.id] = {
                  x: marginSide,
                  y: curSideY,
                  w: sideColW,
                  h: getBoxH(bL, 300),
                };
              }
              if (bR) {
                coords[bR.id] = {
                  x: 100 - marginSide - sideColW,
                  y: curSideY,
                  w: sideColW,
                  h: getBoxH(bR, 300),
                };
              }
              curSideY += rowH + sideGap;
            }
          }
        }

        for (const [id, c] of Object.entries(coords)) {
          const box = document.getElementById(id);
          if (box) {
            const cleanX = parseFloat(c.x.toFixed(4));
            const cleanY = parseFloat(c.y.toFixed(4));
            const cleanW = parseFloat(c.w.toFixed(4));
            const cleanH = parseFloat(c.h.toFixed(4));

            box.style.left = cleanX + "%";
            box.style.top = cleanY + "%";
            box.style.width = cleanW + "%";
            box.style.height = cleanH + "%";

            // Aktualizacja pamięci podręcznej współrzędnych
            const guestId = id.replace("box-", "");
            transformsCache[guestId] = {
              x: cleanX,
              y: cleanY,
              w: cleanW,
              h: cleanH,
            };
          }
        }
      }

      function setLocalLayout(mode, btnElement) {
        if (isLocalFreeMode) {
          applyPresetToLocalFreeMode(mode);
        } else {
          // Bezpieczna zmiana klasy układu bez usuwania innych klas systemowych
          const classesToRemove = [];
          container.classList.forEach((c) => {
            if (c.startsWith("layout-")) classesToRemove.push(c);
          });
          classesToRemove.forEach((c) => container.classList.remove(c));
          container.classList.add(mode);

          // Całkowite wyczyszczenie styli pozycji ze Swobodnego Ustawiania
          document.querySelectorAll(".video-box").forEach((box) => {
            box.style.top = "";
            box.style.left = "";
            box.style.width = "";
            box.style.height = "";
          });
        }
        updateLocalActiveButton(btnElement);
      }

      function localFit4x3Box(id, mode, event) {
        if (event) event.stopPropagation();
        const box = document.getElementById(`box-${id}`);
        if (!box) return;

        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        let curX = parseFloat(box.style.left) || 0;
        let curY = parseFloat(box.style.top) || 0;
        if (!box.style.left.includes("%")) {
          curX = (box.offsetLeft / stageW) * 100;
          curY = (box.offsetTop / stageH) * 100;
        }

        let newW, newH;
        if (mode === "width") {
          // Dopasuj do szerokości 16:9 (320px) -> Wysokość = 240px
          newW = (320 / 1920) * 100;
          newH = (240 / 1080) * 100;
        } else {
          // Dopasuj do wysokości 16:9 (180px) -> Szerokość = 240px
          newW = (240 / 1920) * 100;
          newH = (180 / 1080) * 100;
        }

        if (curX + newW > 100) curX = Math.max(0, 100 - newW);
        if (curY + newH > 100) curY = Math.max(0, 100 - newH);

        box.style.left = curX.toFixed(4) + "%";
        box.style.top = curY.toFixed(4) + "%";
        box.style.width = newW.toFixed(4) + "%";
        box.style.height = newH.toFixed(4) + "%";
      }

      function toggleLocalFreeMode(btnElement) {
        isLocalFreeMode = true;
        container.className = "layout-free";

        const boxes = container.querySelectorAll(".video-box");
        boxes.forEach((box, index) => {
          if (!box.style.left) {
            const id = box.id.replace("box-", "");
            const is4x3 =
              (guests[id]?.ratio || box.getAttribute("data-ratio")) === "4:3";
            const R = is4x3 ? 4 / 3 : 16 / 9;
            const w = (180 / 1080) * 100 * R * 0.5625;
            box.style.width = w.toFixed(4) + "%";
            box.style.height = ((180 / 1080) * 100).toFixed(4) + "%";
            box.style.left = 2 + index * 5 + "%";
            box.style.top = 2 + index * 5 + "%";
          }
        });
        updateLocalActiveButton(btnElement);
      }

      // --- LOKALNY DRAG & DROP W OBS ---
      let obsDraggedEl = null;
      let obsStartX, obsStartY;
      let obsStartLeftPct, obsStartTopPct;

      document.addEventListener("mousedown", (e) => {
        if (!isLocalFreeMode || e.target.closest(".box-fit-btn-group")) return;
        const box = e.target.closest(".video-box");
        if (!box) return;

        obsDraggedEl = box;
        obsStartX = e.clientX;
        obsStartY = e.clientY;

        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        obsStartLeftPct = parseFloat(obsDraggedEl.style.left) || 0;
        obsStartTopPct = parseFloat(obsDraggedEl.style.top) || 0;

        if (!obsDraggedEl.style.left.includes("%")) {
          obsStartLeftPct = (obsDraggedEl.offsetLeft / stageW) * 100;
          obsStartTopPct = (obsDraggedEl.offsetTop / stageH) * 100;
        }
        obsDraggedEl.style.zIndex = 1000;
      });

      document.addEventListener("mousemove", (e) => {
        if (!obsDraggedEl || !isLocalFreeMode) return;

        const isAltPressed = e.altKey;
        const stageW = window.innerWidth;
        const stageH = window.innerHeight;

        const deltaX = e.clientX - obsStartX;
        const deltaY = e.clientY - obsStartY;

        const deltaXPct = (deltaX / stageW) * 100;
        const deltaYPct = (deltaY / stageH) * 100;

        let newX = obsStartLeftPct + deltaXPct;
        let newY = obsStartTopPct + deltaYPct;

        const myW = (obsDraggedEl.offsetWidth / stageW) * 100;
        const myH = (obsDraggedEl.offsetHeight / stageH) * 100;

        const guideX = document.getElementById("guide-x");
        const guideY = document.getElementById("guide-y");
        let snappedX = false;
        let snappedY = false;

        if (!isAltPressed) {
          const SNAP = 1.5;
          const others = Array.from(
            document.querySelectorAll("#video-container .video-box"),
          ).filter((b) => b !== obsDraggedEl);

          for (const other of others) {
            const oX = (other.offsetLeft / stageW) * 100;
            const oY = (other.offsetTop / stageH) * 100;
            const oW = (other.offsetWidth / stageW) * 100;
            const oH = (other.offsetHeight / stageH) * 100;

            if (Math.abs(newX - oX) < SNAP) {
              newX = oX;
              snappedX = true;
            }
            if (Math.abs(newX - (oX + oW)) < SNAP) {
              newX = oX + oW;
              snappedX = true;
            }
            if (Math.abs(newX + myW - oX) < SNAP) {
              newX = oX - myW;
              snappedX = true;
            }
            if (Math.abs(newX + myW - (oX + oW)) < SNAP) {
              newX = oX + oW - myW;
              snappedX = true;
            }

            if (Math.abs(newY - oY) < SNAP) {
              newY = oY;
              snappedY = true;
            }
            if (Math.abs(newY - (oY + oH)) < SNAP) {
              newY = oY + oH;
              snappedY = true;
            }
            if (Math.abs(newY + myH - oY) < SNAP) {
              newY = oY - myH;
              snappedY = true;
            }
            if (Math.abs(newY + myH - (oY + oH)) < SNAP) {
              newY = oY + oH - myH;
              snappedY = true;
            }
          }
        }

        if (snappedX) {
          guideX.style.display = "block";
          guideX.style.left = (newX * stageW) / 100 + "px";
        } else guideX.style.display = "none";
        if (snappedY) {
          guideY.style.display = "block";
          guideY.style.top = (newY * stageH) / 100 + "px";
        } else guideY.style.display = "none";

        newX = Math.max(0, Math.min(newX, 100 - myW));
        newY = Math.max(0, Math.min(newY, 100 - myH));

        obsDraggedEl.style.left = newX + "%";
        obsDraggedEl.style.top = newY + "%";
      });

      document.addEventListener("mouseup", () => {
        if (obsDraggedEl) {
          obsDraggedEl.style.zIndex = "";
          obsDraggedEl = null;
          document.getElementById("guide-x").style.display = "none";
          document.getElementById("guide-y").style.display = "none";
        }
      });

      // --- POŁĄCZENIA WEBRTC ---
      peer.on("open", (id) => {
        console.log("OBS gotowy. ID:", id);
        if (isMulti) connectToDirector(myID);
      });

      function connectToDirector(targetId) {
        directorConn = peer.connect(targetId);
        directorConn.on("open", () => {
          directorConn.send({ type: "register-obs" });
        });
        directorConn.on("data", (data) => handleData(data));
      }

      peer.on("call", (call) => {
        call.answer();
        if (!guests[call.peer]) {
          guests[call.peer] = {
            name: "Łączenie...",
            muted: false,
            mirrored: false,
            transform: { z: 1, x: 0, y: 0 },
            ratio: "16:9",
            conn: null,
          };
        }
        guests[call.peer].call = call;

        if (useULL) {
          setTimeout(() => {
            const pc = call.peerConnection;
            if (pc && pc.getReceivers) {
              pc.getReceivers().forEach((receiver) => {
                if (
                  receiver.track &&
                  receiver.track.kind === "video" &&
                  "playoutDelayHint" in receiver
                ) {
                  receiver.playoutDelayHint = 0;
                }
              });
            }
          }, 500);
        }
        call.on("stream", (stream) => addVideo(stream, call.peer));
        call.on("close", () => removeGuest(call.peer));
        call.on("error", () => removeGuest(call.peer));

        call.peerConnection.oniceconnectionstatechange = () => {
          const s = call.peerConnection.iceConnectionState;
          if (s === "disconnected" || s === "failed" || s === "closed")
            removeGuest(call.peer);
        };
      });

      peer.on("connection", (conn) => {
        conn.on("data", (data) => {
          if (data.type === "director-hello") {
            directorConn = conn;
            sendGuestListToDirector();
          }
          handleData(data, conn);
        });
        conn.on("close", () => removeGuest(conn.peer));
        conn.on("error", () => removeGuest(conn.peer));
      });

      // --- STYLIZACJA (PTZ / LUSTRO) ---
      function applyVideoStyle(id) {
        const guest = guests[id];
        const box = document.getElementById(`box-${id}`);
        if (box && guest) {
          const video = box.querySelector("video") || box.querySelector("img");
          if (video) {
            const z = guest.transform ? guest.transform.z : 1;
            const x = guest.transform ? guest.transform.x : 0;
            const y = guest.transform ? guest.transform.y : 0;
            const scaleX = guest.mirrored ? -z : z;
            const translateX = guest.mirrored ? -x : x;
            video.style.transform = `scale(${scaleX}, ${z}) translate(${translateX}%, ${y}%)`;
          }
          box.setAttribute("data-ratio", guest.ratio || "16:9");
        }
      }

      // --- OBSŁUGA DANYCH I KOMEND ---
      function handleData(data, conn) {
        if (data.type === "layout" && !isLocal) {
          const classesToRemove = [];
          container.classList.forEach((c) => {
            if (c.startsWith("layout-")) classesToRemove.push(c);
          });
          classesToRemove.forEach((c) => container.classList.remove(c));
          container.classList.add(data.mode);
          if (data.mode !== "layout-free") {
            document.querySelectorAll(".video-box").forEach((box) => {
              box.style.top = "";
              box.style.left = "";
              box.style.width = "";
              box.style.height = "";
            });
          }
        }
        if (data.type === "transform-update" && !isLocal) {
          transformsCache[data.targetId] = {
            x: data.x,
            y: data.y,
            w: data.w,
            h: data.h,
          };
          if (container.classList.contains("layout-free")) {
            const box = document.getElementById(`box-${data.targetId}`);
            if (box) {
              box.style.left = data.x + "%";
              box.style.top = data.y + "%";
              box.style.width = data.w + "%";
              box.style.height = data.h + "%";
            }
          }
        }
        if (data.type === "reorder-guests" && !isLocal) {
          data.order.forEach((id) => {
            const box = document.getElementById(`box-${id}`);
            // Przepinamy tylko te, które nie są wykluczone
            if (box && !box.classList.contains("excluded-guest")) {
              container.appendChild(box);
            }
          });
        }
        if (data.type === "toggle-labels") {
          if (data.show) container.classList.add("show-labels");
          else container.classList.remove("show-labels");
        }
        if (data.type === "toggle-icons") {
          if (data.show) container.classList.add("show-icons");
          else container.classList.remove("show-icons");
        }
        if (data.type === "toggle-borders") {
          if (data.show) container.classList.remove("hide-borders");
          else container.classList.add("hide-borders");
        }
        if (data.type === "add-fake-guest")
          addFakeVideo(data.id, data.name, data.img);
        if (data.type === "refresh-cam") {
          if (data.targetId === "all")
            Object.keys(guests).forEach((id) => performRefresh(id));
          else performRefresh(data.targetId);
        }
        if (data.type === "toggle-mirror") {
          if (guests[data.targetId]) {
            guests[data.targetId].mirrored = !guests[data.targetId].mirrored;
            applyVideoStyle(data.targetId);
            sendGuestListToDirector();
          }
        }
        if (data.type === "guest-cam-transform") {
          const peerId = data.targetId || (conn ? conn.peer : null);
          if (peerId && guests[peerId]) {
            guests[peerId].transform = data.transform;
            applyVideoStyle(peerId);
          }
        }

        // GRA
        if (data.type === "game-deal") {
          document.querySelectorAll(".game-card").forEach((el) => el.remove());
          for (const [id, word] of Object.entries(data.cards)) {
            setGameCard(id, word);
          }
        }
        if (data.type === "game-update-card")
          setGameCard(data.targetId, data.word);
        if (data.type === "game-clear")
          document.querySelectorAll(".game-card").forEach((el) => el.remove());

        if (data.type === "remote-mute") {
          if (guests[data.targetId] && guests[data.targetId].conn) {
            guests[data.targetId].conn.send({
              type: "mute-cmd",
              state: data.state,
            });
          }
        }

        // IDENTYFIKACJA (TUTAJ DZIAŁA EXCLUDE / MIX-MINUS)
        if (data.type === "identify") {
          const peerId = data.targetId || (conn ? conn.peer : null);
          if (!peerId) return;

          if (!guests[peerId]) {
            guests[peerId] = {
              name: "Gość",
              muted: false,
              mirrored: false,
              transform: { z: 1, x: 0, y: 0 },
              ratio: "16:9",
            };
          }
          guests[peerId].name = data.name || "Gość";
          guests[peerId].ratio = data.ratio || "16:9";
          if (!isMulti && conn) guests[peerId].conn = conn;

          updateLabel(peerId, data.name);

          const box = document.getElementById(`box-${peerId}`);
          if (box) {
            box.setAttribute("data-ratio", guests[peerId].ratio);

            const card = box.querySelector(".game-card");
            if (
              card &&
              hideTargetName &&
              data.name.toLowerCase().trim() === hideTargetName
            ) {
              card.classList.add("self-hidden");
            }

            // --- LOGIKA WYKLUCZANIA GOŚCIA (MIX-MINUS) ---
            if (
              excludeTargetName &&
              data.name.toLowerCase().trim() === excludeTargetName
            ) {
              box.classList.add("excluded-guest");
              const aEl = box.querySelector("audio");
              if (aEl) aEl.muted = true;
              hiddenContainer.appendChild(box);
            } else {
              box.classList.remove("excluded-guest");
              if (box.parentElement !== container) {
                container.appendChild(box);
              }
            }
          }

          updateGuestCount();
          if (!isMulti) sendGuestListToDirector();
          applyVideoStyle(peerId);
        }

        if (data.type === "mic-status" && conn) {
          if (guests[conn.peer]) {
            guests[conn.peer].muted = data.muted;
            toggleMuteIcon(conn.peer, data.muted);
            sendGuestListToDirector();
          }
        }
        if (data.type === "heartbeat" && conn)
          heartbeats[conn.peer] = Date.now();
        if (data.type === "leave" && conn) removeGuest(conn.peer);
      }

      function setGameCard(id, word) {
        const box = document.getElementById(`box-${id}`);
        if (!box) return;
        let oldCard = box.querySelector(".game-card");
        if (oldCard) oldCard.remove();

        const card = document.createElement("div");
        card.className = "game-card";
        card.innerText = word;

        if (hideTargetName && guests[id] && guests[id].name) {
          if (guests[id].name.toLowerCase().trim() === hideTargetName) {
            card.classList.add("self-hidden");
          }
        }
        box.appendChild(card);
      }

      function updateGuestCount() {
        // Liczy tylko tych, którzy NIE SĄ w hidden-container
        const count = container.querySelectorAll(".video-box").length;
        container.setAttribute("data-count", count);
      }

      function addFakeVideo(id, name, imgSrc) {
        if (document.getElementById(`box-${id}`)) return;
        guests[id] = {
          name: name,
          muted: false,
          mirrored: false,
          transform: { z: 1, x: 0, y: 0 },
          ratio: "16:9",
          conn: null,
        };

        const box = document.createElement("div");
        box.className = "video-box";
        box.id = `box-${id}`;
        box.style.order = 999;

        const img = document.createElement("img");
        img.src = imgSrc;
        img.className = "fake-cam";

        const label = document.createElement("div");
        label.className = "label";
        label.id = `label-${id}`;
        label.innerText = name;

        const muteIcon = document.createElement("div");
        muteIcon.className = "mute-icon";
        muteIcon.innerText = "🔇";
        muteIcon.id = `mute-${id}`;

        box.appendChild(img);
        box.appendChild(label);
        box.appendChild(muteIcon);

        container.appendChild(box);
        updateGuestCount();
        sendGuestListToDirector();
        applyVideoStyle(id);
      }

      function addVideo(stream, id) {
        if (document.getElementById(`box-${id}`)) return;

        heartbeats[id] = Date.now();
        statsCache[id] = { bytes: 0, delayTotal: 0, emittedTotal: 0 };

        if (!guests[id]) {
          guests[id] = {
            name: "Gość",
            muted: false,
            mirrored: false,
            transform: { z: 1, x: 0, y: 0 },
            ratio: "16:9",
          };
        }

        const box = document.createElement("div");
        box.className = "video-box";
        box.id = `box-${id}`;
        box.style.order = 999;

        const currentRatio = guests[id]?.ratio || "16:9";
        box.setAttribute("data-ratio", currentRatio);

        // Jeśli są zapisane współrzędne z Free Mode, zaaplikuj je od razu
        if (
          container.classList.contains("layout-free") &&
          transformsCache[id]
        ) {
          box.style.left = transformsCache[id].x + "%";
          box.style.top = transformsCache[id].y + "%";
          box.style.width = transformsCache[id].w + "%";
          box.style.height = transformsCache[id].h + "%";
        }

        const video = document.createElement("video");
        video.srcObject = stream;
        video.muted = true;
        video.autoplay = true;
        video.playsInline = true;

        const audio = document.createElement("audio");
        audio.srcObject = stream;
        audio.muted = false;
        audio.autoplay = true;
        audio.id = `audio-${id}`;

        const label = document.createElement("div");
        label.className = "label";
        label.id = `label-${id}`;

        const muteIcon = document.createElement("div");
        muteIcon.className = "mute-icon";
        muteIcon.innerText = "🔇";
        muteIcon.id = `mute-${id}`;

        const fitGroup = document.createElement("div");
        fitGroup.className = "box-fit-btn-group";
        fitGroup.innerHTML = `
          <button class="btn-fit-obs" onclick="localFit4x3Box('${id}', 'width', event)" title="Dopasuj do szerokości 16:9 (320px)">↔ Szer.</button>
          <button class="btn-fit-obs" onclick="localFit4x3Box('${id}', 'height', event)" title="Dopasuj do wysokości 16:9 (180px)">↕ Wys.</button>
        `;

        box.appendChild(video);
        box.appendChild(label);
        box.appendChild(muteIcon);
        box.appendChild(audio);
        box.appendChild(fitGroup);

        // --- Mix-Minus sprawdzanie na starcie ---
        let isExcluded = false;
        if (
          guests[id].name &&
          excludeTargetName &&
          guests[id].name.toLowerCase().trim() === excludeTargetName
        ) {
          isExcluded = true;
        }

        if (isExcluded) {
          box.classList.add("excluded-guest");
          audio.muted = true;
          hiddenContainer.appendChild(box);
        } else {
          container.appendChild(box);
        }

        updateGuestCount();
        updateLabel(id, guests[id]?.name);
        toggleMuteIcon(id, guests[id]?.muted);
        applyVideoStyle(id);

        video.play().catch((e) => console.error(e));
        audio.play().catch((e) => console.warn(e));
      }

      function performRefresh(id) {
        const box = document.getElementById(`box-${id}`);
        if (!box) return;
        const video = box.querySelector("video");
        const audio = box.querySelector("audio");
        if (video && video.srcObject) {
          const stream = video.srcObject;
          video.srcObject = null;
          if (audio) audio.srcObject = null;
          setTimeout(() => {
            video.srcObject = stream;
            if (audio) audio.srcObject = stream;
            video.play().catch((e) => console.log(e));
            if (audio) audio.play().catch((e) => console.log(e));
          }, 100);
        }
      }

      function removeGuest(id) {
        if (document.getElementById(`box-${id}`)) {
          document.getElementById(`box-${id}`).remove();
          delete guests[id];
          delete heartbeats[id];
          delete statsCache[id];
          updateGuestCount();
          sendGuestListToDirector();
        }
      }

      function updateLabel(id, name) {
        const label = document.getElementById(`label-${id}`);
        if (label) {
          if (name && name.trim() !== "") {
            label.innerText = name;
            label.style.display = "block";
          } else {
            label.style.display = "none";
          }
        }
      }

      function toggleMuteIcon(id, isMuted) {
        const icon = document.getElementById(`mute-${id}`);
        if (icon) icon.style.display = isMuted ? "block" : "none";
      }

      function sendGuestListToDirector() {
        if (directorConn && directorConn.open) {
          const list = Object.keys(guests).map((id) => ({
            id: id,
            name: guests[id].name,
            muted: guests[id].muted,
            mirrored: guests[id].mirrored,
            ratio: guests[id].ratio,
          }));
          directorConn.send({ type: "guest-list", list: list });
        }
      }

      // --- STATYSTYKI I AUTO-CATCHUP ---
      setInterval(async () => {
        const now = Date.now();
        const statsReport = {};
        for (const peerId in guests) {
          if (peerId.startsWith("fake-")) continue;
          if (heartbeats[peerId] && now - heartbeats[peerId] > 7000) {
            removeGuest(peerId);
            continue;
          }
          const guest = guests[peerId];
          if (guest.call && guest.call.peerConnection) {
            try {
              const stats = await guest.call.peerConnection.getStats();
              let videoStats = null;
              stats.forEach((report) => {
                if (report.type === "inbound-rtp" && report.kind === "video")
                  videoStats = report;
              });

              if (videoStats) {
                const bytes = videoStats.bytesReceived;
                const prevBytes = statsCache[peerId]?.bytes || 0;
                const bitrate = ((bytes - prevBytes) * 8) / 1000;

                const jitterBufferDelay = videoStats.jitterBufferDelay || 0;
                const jitterBufferEmitted =
                  videoStats.jitterBufferEmittedCount || 1;
                const prevDelayTotal = statsCache[peerId]?.delayTotal || 0;
                const prevEmittedTotal = statsCache[peerId]?.emittedTotal || 0;

                const deltaDelay = jitterBufferDelay - prevDelayTotal;
                const deltaEmitted = jitterBufferEmitted - prevEmittedTotal;

                let currentLatency = 0;
                if (deltaEmitted > 0)
                  currentLatency = deltaDelay / deltaEmitted;

                const box = document.getElementById(`box-${peerId}`);
                if (box) {
                  const video = box.querySelector("video");
                  if (video && !video.paused) {
                    if (currentLatency > 0.2) {
                      if (video.playbackRate !== 1.05)
                        video.playbackRate = 1.05;
                    } else if (currentLatency < 0.15) {
                      if (video.playbackRate !== 1.0) video.playbackRate = 1.0;
                    }
                    if (currentLatency > 2.0) performRefresh(peerId);
                  }
                }

                statsCache[peerId] = {
                  bytes: bytes,
                  delayTotal: jitterBufferDelay,
                  emittedTotal: jitterBufferEmitted,
                };

                statsReport[peerId] = {
                  bitrate: Math.round(bitrate),
                  packetLoss: videoStats.packetsLost || 0,
                  resolution:
                    videoStats.frameWidth && videoStats.frameHeight
                      ? `${videoStats.frameWidth}x${videoStats.frameHeight}`
                      : "N/A",
                };
              }
            } catch (e) {}
          }
        }
        if (
          directorConn &&
          directorConn.open &&
          Object.keys(statsReport).length > 0
        ) {
          directorConn.send({ type: "stats-update", stats: statsReport });
        }
      }, 1000);
    </script>
  </body>
