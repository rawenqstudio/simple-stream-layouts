<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>WIDOK OBS - Simple Stream Layouts</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent-sky: #38bdf8;
        --accent-rose: #f43f5e;
      }
      * {
        box-sizing: border-box;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: 0 0;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }
      #video-container {
        width: 100%;
        height: 100%;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }
      .video-box {
        position: relative;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        background: #000;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        aspect-ratio: 16/9;
      }
      .video-box[data-ratio="4:3"] {
        aspect-ratio: 4/3 !important;
      }
      img.fake-cam,
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.2s ease;
      }
      .mute-icon {
        position: absolute;
        top: 12px;
        right: 12px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        background: rgba(244, 63, 94, 0.9);
        backdrop-filter: blur(8px);
        padding: 5px 10px;
        border-radius: 6px;
        display: none;
        z-index: 20;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }
      .label {
        position: absolute;
        bottom: 14px;
        left: 16px;
        color: #fff;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-shadow:
          0 2px 5px rgba(0, 0, 0, 0.95),
          0 0 14px rgba(0, 0, 0, 0.85);
        z-index: 10;
        display: none;
        user-select: none;
        pointer-events: none;
        animation: labelFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #video-container.show-labels .video-box::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 52px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
        pointer-events: none;
        z-index: 5;
        animation: labelFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #video-container:not(.show-labels) .label,
      #video-container:not(.show-labels) .video-box::after {
        display: none !important;
      }
      @keyframes labelFadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #video-container:not(.show-icons) .mute-icon {
        display: none !important;
      }
      #video-container.hide-borders .video-box {
        border: none !important;
      }
      .game-card {
        position: absolute;
        top: 6%;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #fde047, #eab308);
        color: #000;
        padding: 8px 24px;
        font-size: 1.9em;
        font-weight: 800;
        text-transform: uppercase;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        z-index: 50;
        text-align: center;
        border: 2px solid rgba(255, 255, 255, 0.8);
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        white-space: nowrap;
      }
      .game-card.self-hidden {
        opacity: 0 !important;
        pointer-events: none;
      }
      @keyframes popIn {
        0% {
          transform: translateX(-50%) scale(0) rotate(-10deg);
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1) rotate(0);
          opacity: 1;
        }
      }
      #local-panel {
        position: absolute;
        bottom: 35px;
        right: 35px;
        background: rgba(10, 14, 24, 0.96);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(56, 189, 248, 0.5);
        border-radius: 22px;
        padding: 28px;
        z-index: 9999;
        display: none;
        opacity: 0;
        transition:
          opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow:
          0 0 40px rgba(56, 189, 248, 0.25),
          0 25px 60px rgba(0, 0, 0, 0.95);
        width: 530px;
      }
      #local-panel.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #local-panel:not(.visible) {
        transform: translateY(10px);
      }
      #local-panel h4 {
        color: #fff;
        margin: 0 0 20px 0;
        font-size: 22px;
        font-weight: 800;
        text-align: center;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #local-panel h4::after {
        content: "INTERAKCJA";
        font-size: 11px;
        background: rgba(56, 189, 248, 0.2);
        color: var(--accent-sky);
        border: 1px solid rgba(56, 189, 248, 0.45);
        padding: 3px 8px;
        border-radius: 6px;
        font-weight: 800;
      }
      .local-btn-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      #local-panel button {
        background: rgba(255, 255, 255, 0.06);
        color: #f8fafc;
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        padding: 16px 18px;
        border-radius: 14px;
        cursor: pointer;
        font-size: 19px;
        font-weight: 700;
        transition: all 0.15s ease;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        user-select: none;
      }
      #local-panel button:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
      #local-panel button.active-layout {
        background: rgba(56, 189, 248, 0.22) !important;
        border-color: var(--accent-sky) !important;
        color: #fff;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      }
      .layout-free {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .layout-free .video-box {
        position: absolute;
        transition:
          width 0.2s,
          height 0.2s,
          top 0.1s,
          left 0.1s;
        width: 320px;
        height: auto;
        aspect-ratio: auto !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
      }
      box-fit-btn-group {
        position: absolute;
        top: 10px;
        left: 10px;
        display: none !important;
        gap: 6px;
        z-index: 40;
      }
      body.local-interact-active.local-free-mode.local-fit-allowed
        #video-container.layout-free
        .video-box[data-ratio="4:3"]
        .box-fit-btn-group {
        display: flex !important;
      }
      .btn-fit-obs {
        background: #090d16;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 800;
        padding: 6px 11px;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        line-height: 1;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
        font-family: inherit;
        user-select: none;
      }
      .btn-fit-obs.btn-fit-w {
        border: 2px solid rgba(56, 189, 248, 0.85);
        color: var(--accent-sky);
      }
      .btn-fit-obs.btn-fit-w:hover {
        background: var(--accent-sky);
        border-color: #fff;
        color: #000;
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
      }
      .btn-fit-obs.btn-fit-h {
        border: 2px solid rgba(167, 139, 250, 0.85);
        color: #c4b5fd;
      }
      .btn-fit-obs.btn-fit-h:hover {
        background: #a78bfa;
        border-color: #fff;
        color: #000;
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(167, 139, 250, 0.7);
      }

      /* LOKALNY PRZYCISK LUSTRA (WIDOCZNY TYLKO W INTERAKCJI) */
      .btn-mirror-local {
        position: absolute;
        top: 10px;
        right: 10px;
        display: none !important;
        background: #090d16;
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        padding: 6px 10px;
        transition: all 0.15s ease;
        line-height: 1;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
        font-family: inherit;
        z-index: 40;
        user-select: none;
      }
      body.local-interact-active #video-container .video-box .btn-mirror-local {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
      }
      .btn-mirror-local:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }
      .btn-mirror-local.mirror-active {
        background: rgba(56, 189, 248, 0.25);
        border-color: var(--accent-sky);
        color: var(--accent-sky);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.65);
      }

      .layout-free .video-box:active {
        cursor: grabbing;
        z-index: 1000;
        border-color: var(--accent-sky) !important;
      }
      .layout-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        gap: 15px;
        padding: 20px;
        height: 100vh;
      }
      .layout-grid .video-box {
        width: auto;
        height: 45%;
      }
      .layout-grid[data-count="1"] .video-box {
        height: 85%;
      }
      .layout-grid[data-count="2"] .video-box {
        height: 48%;
      }
      .layout-grid[data-count="3"] .video-box,
      .layout-grid[data-count="4"] .video-box {
        height: 45%;
      }
      .layout-grid[data-count="5"] .video-box,
      .layout-grid[data-count="6"] .video-box {
        height: 32%;
      }
      .layout-grid[data-count="7"] .video-box,
      .layout-grid[data-count="8"] .video-box,
      .layout-grid[data-count="9"] .video-box {
        height: 30%;
      }
      .layout-grid[data-count="10"] .video-box,
      .layout-grid[data-count="11"] .video-box,
      .layout-grid[data-count="12"] .video-box {
        height: 23%;
      }
      .layout-sidebar-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        padding-right: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-right .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-sidebar-left {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 20px;
        height: 100vh;
        gap: 15px;
      }
      .layout-sidebar-left .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-bottom {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-bottom .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }
      .layout-top {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
        height: 100vh;
        gap: 20px;
      }
      .layout-top .video-box {
        height: 157px;
        width: auto;
        margin: 0;
      }
      .layout-split {
        display: grid;
        grid-template-columns: 320px 1fr 320px;
        grid-auto-rows: min-content;
        align-content: center;
        row-gap: 30px;
        padding: 20px 40px;
        height: 100vh;
      }
      .layout-split .video-box {
        width: 320px;
        height: auto;
        margin: 0;
      }
      .layout-split .video-box:nth-child(odd) {
        grid-column: 1;
        justify-self: start;
      }
      .layout-split .video-box:nth-child(2n) {
        grid-column: 3;
        justify-self: end;
      }
      .layout-center-stage {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 300px;
        grid-auto-rows: auto;
        gap: 15px;
        padding: 20px;
        height: 100vh;
        width: 100vw;
        box-sizing: border-box;
        align-content: center;
        justify-content: center;
      }
      .layout-center-stage .video-box {
        width: 300px;
        height: auto;
        margin: 0;
        align-self: center;
        justify-self: center;
      }
      .layout-center-stage .video-box[data-ratio="4:3"] {
        width: 300px;
        aspect-ratio: 4/3 !important;
      }
      .layout-center-stage .video-box:first-child {
        grid-column: 2;
        width: 100%;
        max-width: calc(80vh * 16 / 9);
        max-height: 80vh;
        height: auto;
        aspect-ratio: 16/9;
        align-self: center;
        justify-self: center;
        z-index: 10;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      }
      .layout-center-stage .video-box:first-child[data-ratio="4:3"] {
        max-width: calc(80vh * 4 / 3);
        max-height: 80vh;
        aspect-ratio: 4/3 !important;
      }
      .layout-center-stage .video-box:first-child {
        grid-row: 1;
      }
      .layout-center-stage[data-count="2"] .video-box:first-child,
      .layout-center-stage[data-count="3"] .video-box:first-child {
        grid-row: 1;
      }
      .layout-center-stage[data-count="4"] .video-box:first-child,
      .layout-center-stage[data-count="5"] .video-box:first-child {
        grid-row: 1 / span 2;
      }
      .layout-center-stage[data-count="6"] .video-box:first-child,
      .layout-center-stage[data-count="7"] .video-box:first-child {
        grid-row: 1 / span 3;
      }
      .layout-center-stage[data-count="8"] .video-box:first-child,
      .layout-center-stage[data-count="9"] .video-box:first-child {
        grid-row: 1 / span 4;
      }
      .layout-center-stage .video-box:nth-child(2) {
        grid-column: 1;
        grid-row: 1;
      }
      .layout-center-stage .video-box:nth-child(3) {
        grid-column: 3;
        grid-row: 1;
      }
      .layout-center-stage .video-box:nth-child(4) {
        grid-column: 1;
        grid-row: 2;
      }
      .layout-center-stage .video-box:nth-child(5) {
        grid-column: 3;
        grid-row: 2;
      }
      .layout-center-stage .video-box:nth-child(6) {
        grid-column: 1;
        grid-row: 3;
      }
      .layout-center-stage .video-box:nth-child(7) {
        grid-column: 3;
        grid-row: 3;
      }
      .layout-center-stage .video-box:nth-child(8) {
        grid-column: 1;
        grid-row: 4;
      }
      .layout-center-stage .video-box:nth-child(9) {
        grid-column: 3;
        grid-row: 4;
      }
      .layout-center-stage[data-count="1"] {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .layout-center-stage[data-count="1"] .video-box:first-child {
        width: 100%;
        max-width: calc(85vh * 16 / 9);
        max-height: 85vh;
        height: auto;
      }
      .layout-center-stage[data-count="1"]
        .video-box:first-child[data-ratio="4:3"] {
        max-width: calc(85vh * 4 / 3);
        max-height: 85vh;
        height: auto;
      }
      .guide-line {
        position: absolute;
        background-color: var(--accent-rose);
        z-index: 9999;
        display: none;
        pointer-events: none;
      }
      .guide-x {
        width: 100%;
        height: 1px;
        left: 0;
      }
      .guide-y {
        height: 100%;
        width: 1px;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="guide-x" class="guide-line guide-x"></div>
    <div id="guide-y" class="guide-line guide-y"></div>
    <div id="hidden-container" style="display: none"></div>
    <div id="video-container" class="layout-grid" data-count="0"></div>
    <div id="local-panel">
      <h4>Własny Układ Ekranu</h4>
      <div class="local-btn-container">
        <button
          onclick="setLocalLayout('layout-grid', this)"
          style="grid-column: span 2"
          class="active-layout"
        >
          🔳 Pełna Siatka
        </button>
        <button onclick="setLocalLayout('layout-top', this)">⬆️ Góra</button>
        <button onclick="setLocalLayout('layout-bottom', this)">⬇️ Dół</button>
        <button onclick="setLocalLayout('layout-sidebar-left', this)">
          ⬅️ Lewo
        </button>
        <button onclick="setLocalLayout('layout-sidebar-right', this)">
          ➡️ Prawo
        </button>
        <button onclick="setLocalLayout('layout-split', this)">↔️ Split</button>
        <button onclick="setLocalLayout('layout-center-stage', this)">
          ⭐️ Center
        </button>
        <button
          onclick="toggleLocalFreeMode(this)"
          style="
            grid-column: span 2;
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
          "
        >
          🔓 Swobodne Ustawianie
        </button>
      </div>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search),
        myID = urlParams.get("room") || "test-room",
        useStunOnly = urlParams.get("stunonly"),
        useULL = urlParams.get("ull"),
        isMulti = urlParams.get("multi"),
        isLocal = "1" === urlParams.get("local"),
        hideTargetName = urlParams.get("hide")
          ? urlParams.get("hide").toLowerCase().trim()
          : null,
        excludeTargetNames = urlParams.get("exclude")
          ? urlParams
              .get("exclude")
              .toLowerCase()
              .split(",")
              .map((e) => e.trim())
              .filter(Boolean)
          : [],
        selectedConfig = useStunOnly
          ? [{ urls: "stun:stun.l.google.com:19302" }]
          : [
              { urls: "stun:stun.l.google.com:19302" },
              {
                urls: "turn:openrelay.metered.ca:80?transport=udp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:80?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:443?transport=udp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
            ],
        peer = new Peer(isMulti ? void 0 : myID, {
          config: { iceServers: selectedConfig },
        }),
        container = document.getElementById("video-container"),
        hiddenContainer = document.getElementById("hidden-container"),
        guests = {},
        heartbeats = {};
      let directorConn = null;
      const statsCache = {};
      let hidePanelTimeout,
        isLocalFreeMode = !1,
        currentGuestOrder = [];
      const pendingTransforms = {};
      function applyGuestOrder() {
        currentGuestOrder &&
          0 !== currentGuestOrder.length &&
          currentGuestOrder.forEach((e, t) => {
            const o = document.getElementById(`box-${e}`);
            o &&
              ((o.style.order = t + 1),
              o.classList.contains("excluded-guest") ||
                o.parentElement !== container ||
                container.appendChild(o));
          });
      }
      function applyGuestState(e) {
        const t = document.getElementById(`box-${e}`);
        if (!t) return;
        const o = guests[e];
        (pendingTransforms[e] &&
          container.classList.contains("layout-free") &&
          ((t.style.left = pendingTransforms[e].x + "%"),
          (t.style.top = pendingTransforms[e].y + "%"),
          (t.style.width = pendingTransforms[e].w + "%"),
          (t.style.height = pendingTransforms[e].h + "%")),
          applyVideoStyle(e),
          o && (updateLabel(e, o.name), toggleMuteIcon(e, o.muted)),
          applyGuestOrder());
      }
      if (isLocal) {
        const e = document.getElementById("local-panel");
        ((e.style.display = "block"), (container.className = "layout-grid"));
        const t = () => {
            (clearTimeout(hidePanelTimeout),
              e.classList.remove("visible"),
              document.body.classList.remove("local-interact-active"));
          },
          o = () => {
            (e.classList.add("visible"),
              document.body.classList.add("local-interact-active"),
              clearTimeout(hidePanelTimeout),
              (hidePanelTimeout = setTimeout(t, 5e3)));
          };
        (window.addEventListener("mousemove", o),
          window.addEventListener("mousedown", o),
          window.addEventListener("blur", t),
          document.addEventListener("mouseleave", t));
      }
      function updateLocalActiveButton(e) {
        e &&
          (document
            .querySelectorAll("#local-panel button")
            .forEach((e) => e.classList.remove("active-layout")),
          e.classList.add("active-layout"));
      }
      function updateContainerLayoutClass(e) {
        const t = [];
        (container.classList.forEach((e) => {
          e.startsWith("layout-") && t.push(e);
        }),
          t.forEach((e) => container.classList.remove(e)),
          container.classList.add(e));
      }
      function setLocalLayout(e, t) {
        (isLocalFreeMode
          ? applyPresetToLocalFreeMode(e)
