<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Stream Layouts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #090b10;
        --bg-card: #121622;
        --bg-card-raised: #181e2e;
        --bg-input: #0b0e17;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --text-subtle: #64748b;
        --accent-sky: #38bdf8;
        --accent-amber: #f59e0b;
        --accent-pink: #ec4899;
        --accent-violet: #8b5cf6;
        --accent-emerald: #10b981;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        background-image:
          radial-gradient(
            circle at 50% 0%,
            rgba(56, 189, 248, 0.12) 0%,
            transparent 60%
          ),
          radial-gradient(
            circle at 85% 30%,
            rgba(99, 102, 241, 0.08) 0%,
            transparent 50%
          );
        padding: 60px 20px 80px;
        margin: 0;
        text-align: center;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 36px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }
      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
      }

      h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 8px 0;
        background: linear-gradient(135deg, #fff 40%, #94a3b8);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 28px 0;
      }

      .create-btn {
        width: 100%;
        padding: 14px 24px;
        background: linear-gradient(135deg, var(--accent-sky), #0284c7);
        border: none;
        border-radius: 12px;
        color: #000;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 18px rgba(56, 189, 248, 0.25);
      }
      .create-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
      }

      #links-area {
        display: none;
        margin-top: 24px;
        text-align: left;
        flex-direction: column;
        gap: 14px;
      }

      .link-group-card {
        background: var(--bg-card-raised);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        padding: 16px;
        transition: border-color 0.2s ease;
      }
      .link-group-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
      }

      .link-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .badge-step {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
      }
      .badge-step.step-dir {
        background: rgba(245, 158, 11, 0.2);
        color: var(--accent-amber);
        border: 1px solid rgba(245, 158, 11, 0.3);
      }
      .badge-step.step-guest {
        background: rgba(236, 72, 153, 0.2);
        color: var(--accent-pink);
        border: 1px solid rgba(236, 72, 153, 0.3);
      }
      .badge-step.step-obs {
        background: rgba(139, 92, 246, 0.2);
        color: var(--accent-violet);
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      .link-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-main);
      }
      .link-desc {
        font-size: 11.5px;
        color: var(--text-subtle);
        margin-left: auto;
      }

      .input-action-row {
        display: flex;
        gap: 8px;
      }

      .clean-input {
        flex: 1;
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        color: #94a3b8;
        font-family: monospace;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 9px;
        outline: none;
        transition: all 0.2s;
        width: 100%;
        box-sizing: border-box;
      }
      .clean-input:focus {
        border-color: var(--accent-sky);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .btn-action {
        padding: 10px 14px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        transition: all 0.15s;
      }
      .btn-copy {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-main);
        border-color: var(--border-subtle);
      }
      .btn-copy:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .btn-open {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border-color: rgba(16, 185, 129, 0.3);
      }
      .btn-open:hover {
        background: rgba(16, 185, 129, 0.25);
      }

      .footer-credits {
        position: fixed;
        bottom: 15px;
        right: 20px;
        color: var(--text-subtle);
        font-size: 0.85em;
        font-family: monospace;
        user-select: none;
        pointer-events: none;
        z-index: 1000;
      }
      .donate-btn {
        position: fixed;
        bottom: 15px;
        left: 20px;
        z-index: 1000;
        display: block;
        transition: transform 0.2s;
      }
      .donate-btn img {
        height: 45px;
        display: block;
      }
      .donate-btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎥 Simple Stream Layouts</h1>
      <p class="subtitle">
        Błyskawiczne studio do streamingu. Jedno kliknięcie, zero konfiguracji.
      </p>
      <button class="create-btn" onclick="createRoom()">
        + Utwórz Nowe Studio
      </button>
      <div id="links-area">
        <!-- 1. REŻYSER -->
        <div class="link-group-card" id="group-dir" style="order: 1">
          <div class="link-header">
            <div class="badge-step step-dir">1</div>
            <span class="link-title">Twój Panel Reżysera</span>
            <span class="link-desc">Uruchom jako pierwszy</span>
          </div>
          <div class="input-action-row">
            <input
              type="text"
              id="director-link"
              class="clean-input"
              readonly="readonly"
            />
            <button class="btn-action btn-copy" onclick="copy('director-link')">
              📋 Kopiuj
            </button>
            <button
              class="btn-action btn-open"
              onclick="openLink('director-link')"
            >
              ↗ Otwórz
            </button>
          </div>
        </div>

        <!-- 2. GOŚCIE -->
        <div class="link-group-card" id="group-guest" style="order: 2">
          <div class="link-header">
            <div class="badge-step step-guest">2</div>
            <span class="link-title">Link dla Gości</span>
            <span class="link-desc">Wyślij uczestnikom</span>
          </div>
          <div class="input-action-row">
            <input
              type="text"
              id="guest-link"
              class="clean-input"
              readonly="readonly"
            />
            <button class="btn-action btn-copy" onclick="copy('guest-link')">
              📋 Kopiuj
            </button>
            <button
              class="btn-action btn-open"
              onclick="openLink('guest-link')"
            >
              ↗ Otwórz
            </button>
          </div>
        </div>

        <!-- 3. OBS / EKRAN GRY -->
        <div class="link-group-card" id="group-obs" style="order: 3">
          <div class="link-header">
            <div class="badge-step step-obs">3</div>
            <span class="link-title">Źródło OBS / Ekran Gry</span>
            <span class="link-desc">Browser Source (1920x1080)</span>
          </div>
          <div class="input-action-row">
            <input
              type="text"
              id="obs-link"
              class="clean-input"
              readonly="readonly"
            />
            <button class="btn-action btn-copy" onclick="copy('obs-link')">
              📋 Kopiuj
            </button>
          </div>
        </div>
      </div>
    </div>
    <a
      href="https://www.paypal.com/paypalme/rawen90"
      target="_blank"
      class="donate-btn"
      title="Wsparcie / Donate"
      ><img src="https://i.ibb.co/d48v0byS/donate-pp.png" alt="PayPal Donate"
    /></a>
    <div class="footer-credits">from xrawenq for Goodiez</div>
    <script>
      function createRoom() {
        const e = `?room=${Math.random().toString(36).substring(2, 9)}&stunonly=1&ull=1&multi=1`;
        let t = window.location.href;
        (t.endsWith("index.html") && (t = t.replace("index.html", "")),
          t.endsWith("/") || (t += "/"));
        const n = `${t}obs.html${e}`,
          o = `${t}director.html${e}`,
          l = `${t}guest.html${e}`;
        ((document.getElementById("obs-link").value = n),
          (document.getElementById("director-link").value = o),
          (document.getElementById("guest-link").value = l),
          (document.getElementById("links-area").style.display = "flex"));
        const c = document.querySelector(".create-btn");
        ((c.innerText = "🔄 Wygeneruj nowy pokój"),
          (c.style.background = "rgba(255, 255, 255, 0.08)"),
          (c.style.color = "var(--text-main)"),
          (c.style.border = "1px solid var(--border-subtle)"),
          (c.style.boxShadow = "none"));
      }
      function copy(e) {
        const input = document.getElementById(e);
        input.select();
        navigator.clipboard
          .writeText(input.value)
          .then(() => {
            const btn = event.target.closest("button");
            const originalText = btn.innerText;
            btn.innerText = "✅ Skopiowano";
            btn.style.background = "rgba(16, 185, 129, 0.25)";
            btn.style.color = "#34d399";
            btn.style.borderColor = "rgba(16, 185, 129, 0.4)";
            setTimeout(() => {
              btn.innerText = originalText;
              btn.style.background = "";
              btn.style.color = "";
              btn.style.borderColor = "";
            }, 1500);
          })
          .catch(() => {
            document.execCommand("copy");
          });
      }
      function openLink(e) {
        const t = document.getElementById(e).value;
        t && window.open(t, "_blank");
      }
    </script>
  </body>
</html>
