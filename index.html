<!doctype html><html lang="pl"><head><meta charset="UTF-8"><title>Simple Stream Layouts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg-main:#090b10;--bg-card:#121622;--bg-card-raised:#181e2e;--bg-input:#0b0e17;--border-subtle:rgba(255, 255, 255, 0.08);--text-main:#f8fafc;--text-muted:#94a3b8;--text-subtle:#64748b;--accent-sky:#38bdf8;--accent-amber:#f59e0b;--accent-pink:#ec4899;--accent-violet:#8b5cf6;--accent-emerald:#10b981}*{box-sizing:border-box}body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background-color:var(--bg-main);color:var(--text-main);min-height:100vh;background-image:radial-gradient(circle at 50% 0,rgba(56,189,248,.12) 0,transparent 60%),radial-gradient(circle at 85% 30%,rgba(99,102,241,.08) 0,transparent 50%);padding:60px 20px 80px;margin:0;text-align:center}.container{max-width:640px;margin:0 auto;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:20px;padding:36px;box-shadow:0 20px 40px -15px rgba(0,0,0,.6);position:relative;overflow:hidden}.container::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px 0;background:linear-gradient(135deg,#fff 40%,#94a3b8);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}p.subtitle{color:var(--text-muted);font-size:14px;line-height:1.5;margin:0 0 28px 0}.room-input-container{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}.room-input{text-align:center;font-size:14.5px;padding:13px 18px;background:var(--bg-card-raised);border:1px solid var(--border-subtle);border-radius:12px;color:var(--text-main);font-family:inherit;outline:0;transition:all .2s ease}.room-input:focus{border-color:var(--accent-sky);box-shadow:0 0 0 3px rgba(56,189,248,.15)}.room-input::placeholder{color:var(--text-subtle);font-family:inherit}.create-btn{width:100%;padding:14px 24px;background:linear-gradient(135deg,var(--accent-sky),#0284c7);border:none;border-radius:12px;color:#000;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s cubic-bezier(.16, 1, .3, 1);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(56,189,248,.25)}.create-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.4)}#links-area{display:none;margin-top:24px;text-align:left;flex-direction:column;gap:14px}.link-group-card{background:var(--bg-card-raised);border:1px solid var(--border-subtle);border-radius:14px;padding:16px;transition:border-color .2s ease}.link-group-card:hover{border-color:rgba(255,255,255,.15)}.link-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.badge-step{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}.badge-step.step-dir{background:rgba(245,158,11,.2);color:var(--accent-amber);border:1px solid rgba(245,158,11,.3)}.badge-step.step-guest{background:rgba(236,72,153,.2);color:var(--accent-pink);border:1px solid rgba(236,72,153,.3)}.badge-step.step-obs{background:rgba(139,92,246,.2);color:var(--accent-violet);border:1px solid rgba(139,92,246,.3)}.link-title{font-size:13.5px;font-weight:600;color:var(--text-main)}.link-desc{font-size:11.5px;color:var(--text-subtle);margin-left:auto}.input-action-row{display:flex;gap:8px}.clean-input{flex:1;background:var(--bg-input);border:1px solid var(--border-subtle);color:#94a3b8;font-family:monospace;font-size:13px;padding:10px 14px;border-radius:9px;outline:0;transition:all .2s;width:100%;box-sizing:border-box}.clean-input:focus{border-color:var(--accent-sky);box-shadow:0 0 0 3px rgba(56,189,248,.15)}.btn-action{padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s}.btn-copy{background:rgba(255,255,255,.06);color:var(--text-main);border-color:var(--border-subtle)}.btn-copy:hover{background:rgba(255,255,255,.12)}.btn-open{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.3)}.btn-open:hover{background:rgba(16,185,129,.25)}.donate-btn{display:inline-block;margin-top:30px;transition:transform .2s}.donate-btn img{height:42px;display:block}.donate-btn:hover{transform:scale(1.05)}.footer-credits{margin-top:12px;color:var(--text-subtle);font-size:.85em;font-family:monospace;user-select:none}</style></head><body><div class="container"><h1>🎥 Simple Stream Layouts</h1><p class="subtitle">Błyskawiczne studio do streamingu. Jedno kliknięcie, zero konfiguracji.</p><div class="room-input-container"><input type="text" id="custom-room-name" class="room-input" placeholder="Wpisz nazwę studia (np. turniej, podcast)..." autocomplete="off" onkeydown='"Enter"===event.key&&createRoom()'> <button class="create-btn" onclick="createRoom()">+ Utwórz Studio</button></div><div id="links-area"><div class="link-group-card" id="group-dir" style="order:1"><div class="link-header"><div class="badge-step step-dir">1</div><span class="link-title">Twój Panel Reżysera</span> <span class="link-desc">Uruchom jako pierwszy</span></div><div class="input-action-row"><input type="text" id="director-link" class="clean-input" readonly="readonly"> <button class="btn-action btn-copy" onclick='copy("director-link")'>📋 Kopiuj</button> <button class="btn-action btn-open" onclick='openLink("director-link")'>↗ Otwórz</button></div></div><div class="link-group-card" id="group-guest" style="order:2"><div class="link-header"><div class="badge-step step-guest">2</div><span class="link-title">Link dla Gości</span> <span class="link-desc">Wyślij uczestnikom</span></div><div class="input-action-row"><input type="text" id="guest-link" class="clean-input" readonly="readonly"> <button class="btn-action btn-copy" onclick='copy("guest-link")'>📋 Kopiuj</button> <button class="btn-action btn-open" onclick='openLink("guest-link")'>↗ Otwórz</button></div></div><div class="link-group-card" id="group-obs" style="order:3"><div class="link-header"><div class="badge-step step-obs">3</div><span class="link-title">Źródło OBS / Ekran Gry</span> <span class="link-desc">Browser Source (1920x1080)</span></div><div class="input-action-row"><input type="text" id="obs-link" class="clean-input" readonly="readonly"> <button class="btn-action btn-copy" onclick='copy("obs-link")'>📋 Kopiuj</button></div></div></div></div><a href="https://www.paypal.com/paypalme/rawen90" target="_blank" class="donate-btn" title="Wsparcie / Donate"><img src="https://i.ibb.co/d48v0byS/donate-pp.png" alt="PayPal Donate"></a><div class="footer-credits">from xrawenq for Goodiez</div><script>function sanitizeRoomName(e){return e.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g,"-").replace(/[^a-z0-9-_]/g,"")}function createRoom(){const e=document.getElementById("custom-room-name"),t=sanitizeRoomName(e.value),o=t||Math.random().toString(36).substring(2,9);t&&(e.value=t);const n=`?room=${o}&stunonly=1&ull=1&multi=1`;let l=window.location.href;l.endsWith("index.html")&&(l=l.replace("index.html","")),l.endsWith("/")||(l+="/");const r=`${l}obs.html${n}`,a=`${l}director.html${n}`,c=`${l}guest.html${n}`;document.getElementById("obs-link").value=r,document.getElementById("director-link").value=a,document.getElementById("guest-link").value=c,document.getElementById("links-area").style.display="flex";const i=document.querySelector(".create-btn");i.innerText="🔄 Zaktualizuj / Wygeneruj pokój",i.style.background="rgba(255, 255, 255, 0.08)",i.style.color="var(--text-main)",i.style.border="1px solid var(--border-subtle)",i.style.boxShadow="none"}function copy(e){const t=document.getElementById(e);t.select(),navigator.clipboard.writeText(t.value).then(()=>{const e=event.target.closest("button"),t=e.innerText;e.innerText="✅ Skopiowano",e.style.background="rgba(16, 185, 129, 0.25)",e.style.color="#34d399",e.style.borderColor="rgba(16, 185, 129, 0.4)",setTimeout(()=>{e.innerText=t,e.style.background="",e.style.color="",e.style.borderColor=""},1500)}).catch(()=>{document.execCommand("copy")})}function openLink(e){const t=document.getElementById(e).value;t&&window.open(t,"_blank")}</script></body></html>
