<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>GOŚĆ - Ustawienia</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        text-align: center;
        background: #222;
        color: #fff;
        padding: 20px;
        margin: 0;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #333;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin-top: 0;
        color: #00d2ff;
      }
      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
        border: 2px solid #555;
        transition: aspect-ratio 0.3s;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #mute-indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        background: red;
        color: #fff;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: 700;
        display: none;
        box-shadow: 0 0 5px #000;
        font-size: 0.8em;
        z-index: 10;
      }
      .settings-group {
        text-align: left;
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
        font-size: 0.9em;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 10px;
        background: #222;
        border: 1px solid #555;
        color: #fff;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }
      button {
        padding: 15px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 5px;
        width: 100%;
        margin-top: 10px;
        transition: 0.2s;
      }
      button:hover {
        background: #218838;
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
        color: #aaa;
      }
      #logs {
        margin-top: 20px;
        color: #aaa;
        font-size: 0.8em;
        text-align: left;
        background: #111;
        padding: 10px;
        border-radius: 5px;
        font-family: monospace;
        max-height: 150px;
        overflow-y: auto;
      }
      .error {
        color: #f44;
      }
      .success {
        color: #0f0;
      }
      #target-id {
        display: none;
      }
      #monitor-area {
        display: none;
        margin-top: 20px;
        border-top: 1px solid #555;
        padding-top: 15px;
      }
      .btn-monitor {
        background: #ff9800;
        color: #fff;
      }
      .btn-monitor:hover {
        background: #e68900;
      }
      .crop-controls {
        background: #222;
        padding: 15px;
        border-radius: 5px;
        border: 1px solid #444;
        margin-bottom: 15px;
      }
      .slider-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .slider-row span {
        width: 70px;
        font-size: 0.85em;
        color: #aaa;
        text-align: left;
      }
      .slider-row input[type="range"] {
        flex-grow: 1;
        cursor: pointer;
      }
      .btn-reset-crop {
        padding: 8px;
        font-size: 14px;
        background: #555;
        margin-top: 5px;
      }
      .btn-reset-crop:hover {
        background: #666;
      }
      .footer-credits {
        position: fixed;
        bottom: 15px;
        right: 20px;
        color: #666;
        font-size: 0.85em;
        font-family: monospace;
        user-select: none;
        pointer-events: none;
        z-index: 1000;
      }
      .donate-btn {
        position: fixed;
        bottom: 15px;
        left: 20px;
        z-index: 1000;
        display: block;
        transition: transform 0.2s;
      }
      .donate-btn img {
        height: 45px;
        display: block;
      }
      .donate-btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Ustawienia Studia</h1>
      <div class="video-wrapper">
        <video id="localVideo" autoplay muted playsinline></video>
        <div id="mute-indicator">🔇 WYCISZONY</div>
      </div>
      <div class="crop-controls">
        <label style="margin-bottom: 10px; font-weight: 700; color: #fff"
          >🖼️ Kadrowanie obrazu (Zostanie wysłane do OBS):</label
        >
        <div class="slider-row">
          <span>🔍 Zoom:</span>
          <input
            type="range"
            id="cam-z"
            min="1"
            max="3"
            step="0.05"
            value="1"
            oninput="updateTransform()"
          />
        </div>
        <div class="slider-row">
          <span>↔️ Poziom:</span>
          <input
            type="range"
            id="cam-x"
            min="-50"
            max="50"
            step="1"
            value="0"
            oninput="updateTransform()"
          />
        </div>
        <div class="slider-row">
          <span>↕️ Pion:</span>
          <input
            type="range"
            id="cam-y"
            min="-50"
            max="50"
            step="1"
            value="0"
            oninput="updateTransform()"
          />
        </div>
        <button onclick="resetTransform()" class="btn-reset-crop">
          Początkowy Kadr
        </button>
      </div>
      <div class="settings-group">
        <label>📐 Format Obrazu:</label>
        <select id="cameraRatio" onchange="startPreview()">
          <option value="16:9">Panoramiczny (16:9)</option>
          <option value="4:3">Klasyczny (4:3)</option>
        </select>
      </div>
      <div class="settings-group">
        <label>📷 Wybierz Kamerę:</label>
        <select id="videoSource" onchange="startPreview()"></select>
      </div>
      <div class="settings-group">
        <label>🎤 Wybierz Mikrofon:</label>
        <select id="audioSource" onchange="startPreview()"></select>
      </div>
      <div class="settings-group">
        <label class="checkbox-group"
          ><input type="checkbox" id="start-muted" checked="checked" />
          <span>Dołącz z wyciszonym mikrofonem</span></label
        >
        <label class="checkbox-group" title="Wymusza wysoki bitrate (6 Mbps)"
          ><input type="checkbox" id="high-bitrate" checked="checked" />
          <span>🔥 Unlock Bitrate</span></label
        >
      </div>
      <div class="settings-group">
        <label
          >Twoje Imię
          <span style="color: #ff4444; font-size: 0.9em; font-weight: 700"
            >(Pole wymagane)</span
          >:</label
        >
        <input type="text" id="username" placeholder="Wpisz swoje imię..." />
      </div>
      <input type="text" id="target-id" />
      <button id="join-btn" onclick="joinRoom()" disabled="disabled">
        Ładowanie kamery...
      </button>
      <div id="monitor-area">
        <p style="margin-bottom: 5px; color: #ccc">
          Potrzebujesz widzieć grę i innych?
        </p>
        <label
          class="checkbox-group"
          style="justify-content: center; margin-bottom: 15px"
          ><input
            type="checkbox"
            id="local-monitor"
            checked="checked"
            onchange="regenerateLink()"
          />
          <span style="font-size: 0.85em; color: #00d2ff"
            >🛠️ Niezależny Podgląd (Zmieniaj układ samemu)</span
          ></label
        >
        <button id="btn-open-monitor" class="btn-monitor">
          📋 Skopiuj Link Podglądu (Ukryj moje hasło)
        </button>
      </div>
      <div id="logs"></div>
    </div>
    <a
      href="https://www.paypal.com/paypalme/rawen90"
      target="_blank"
      class="donate-btn"
      title="Wsparcie / Donate"
      ><img src="https://i.ibb.co/d48v0byS/donate-pp.png" alt="PayPal Donate"
    /></a>
    <div class="footer-credits">from xrawenq for Goodiez</div>
    <script>

              { urls: "stun:stun.l.google.com:19302" },
              {
                urls: "turn:openrelay.metered.ca:80?transport=udp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:80?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:443?transport=udp",
                username: "openrelayproject",
                credential: "openrelayproject",
              },
              {
                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject",

      let currentTransform = { z: 1, x: 0, y: 0 };

        ((currentTransform.z = parseFloat(
          document.getElementById("cam-z").value,

          (currentTransform.y = parseFloat(
            document.getElementById("cam-y").value,

      function resetTransform() {

          (audioSelect.innerHTML = ""),
          e.forEach((e) => {

                  videoSelect.appendChild(t))

                  ((t.text = e.label || `Mikrofon ${audioSelect.length + 1}`),
                  audioSelect.appendChild(t)));

      }
      async function startPreview() {

        (e
          ? log("🔄 Zmiana sprzętu w locie...", "info")
          : ((joinBtn.disabled = !0),
            (joinBtn.innerText = "Ustawianie kamery...")),
          localStream && localStream.getTracks().forEach((e) => e.stop()));
        const t = document.getElementById("cameraRatio").value,

        document.querySelector(".video-wrapper").style.aspectRatio = t.replace(
          ":",
          "/",

        const o = {
          video: {
            deviceId: videoSelect.value ? { exact: videoSelect.value } : void 0,
            width: { ideal: n },
            height: { ideal: 1080 },

          audio: {
            deviceId: audioSelect.value ? { exact: audioSelect.value } : void 0,
          },
        };
        try {
          ((localStream = await navigator.mediaDevices.getUserMedia(o)),
            (document.getElementById("localVideo").srcObject = localStream));
          const n = localStream.getVideoTracks()[0];
          if (
            (n && "contentHint" in n && (n.contentHint = "motion"),
            checkMuteState(),
            e)
          ) {
            activeCalls.forEach((e) => {
              if (e.peerConnection) {
                const t = e.peerConnection.getSenders(),
                  n = t.find((e) => e.track && "video" === e.track.kind),
                  o = t.find((e) => e.track && "audio" === e.track.kind);
                (n &&
                  localStream.getVideoTracks().length > 0 &&
                  n.replaceTrack(localStream.getVideoTracks()[0]),
                  o &&
                    localStream.getAudioTracks().length > 0 &&
                    o.replaceTrack(localStream.getAudioTracks()[0]));
              }
            });
            const e = {
              type: "identify",
              name: document.getElementById("username").value.trim(),
              ratio: t,
            };
            (isMulti && directorConn && directorConn.open
              ? directorConn.send(e)
              : !isMulti && globalConn && globalConn.open && globalConn.send(e),
              log(
                "✅ Sprzęt podmieniony płynnie! OBS zaktualizowany.",
                "success",
              ));
          } else
            ((joinBtn.disabled = !1),
              (joinBtn.innerText = "DOŁĄCZ DO STUDIA"),
              log("Kamera gotowa. Możesz dołączyć.", "success"));
        } catch (t) {
          (log("Błąd sprzętu: " + t.name, "error"),
            e || (joinBtn.innerText = "BŁĄD KAMERY"));
        }
      }
      function checkMuteState() {
        if (!localStream) return;
        const e = document.getElementById("start-muted").checked,
          t = localStream.getAudioTracks()[0];
        t && ((t.enabled = !e), toggleMuteUI(e));
      }
      function toggleMuteUI(e) {
        document.getElementById("mute-indicator").style.display = e
          ? "block"
          : "none";
      }
      async function joinRoom() {
        const uInput = document.getElementById("username");
        const t = uInput.value.trim();
        if (!t || t.length < 2) {
          uInput.style.border = "2px solid #ff4444";
          uInput.focus();
          log(
            "BŁĄD: Wpisz swoje imię (min. 2 znaki) przed dołączeniem!",
            "error",
          );
          alert(
            "Podaj swoje imię (minimum 2 znaki), aby móc dołączyć do studia.",
          );
          return;
        }
        uInput.style.border = "1px solid #555";
        try {
          localStorage.setItem("ssl_guest_name", t);
        } catch (err) {}

        const e = document.getElementById("target-id").value,
          n = document.getElementById("high-bitrate").checked,
          o = document.getElementById("cameraRatio").value;
        ((joinBtn.disabled = !0),
          (joinBtn.innerText = "Łączenie..."),
          generateMonitorLink(e, t),
          log("Dzwonię do OBS..."));
        const a = localStream.getVideoTracks()[0];
        (a && "contentHint" in a && (a.contentHint = "motion"),
          isMulti
            ? ((directorConn = peer.connect(e)),
              directorConn.on("open", () => {
                (log(
                  "Połączono z Reżyserem. Pobieram listę ekranów...",
                  "success",
                ),
                  directorConn.send({ type: "get-obs-list" }),
                  directorConn.send({ type: "identify", name: t, ratio: o }));
                const e = document.getElementById("start-muted").checked;
                (directorConn.send({ type: "mic-status", muted: e }),
                  directorConn.send({
                    type: "guest-cam-transform",
                    transform: currentTransform,
                  }),
                  setInterval(() => {
                    directorConn.open &&
                      directorConn.send({ type: "heartbeat" });
                  }, 2e3));
              }),
              directorConn.on("data", (e) => {
                ("obs-list" === e.type &&
                  (log(
                    `Aktualizacja listy OBS: znaleziono ${e.targets.length}`,
                  ),
                  e.targets.forEach((e) => {
                    activeCallIds.includes(e) || callSingleOBS(e, t, n, o);
                  }),
                  (joinBtn.innerText = "JESTEŚ NA WIZJI (MULTI)"),
                  (joinBtn.style.background = "#dc3545"),
                  (document.getElementById("monitor-area").style.display =
                    "block")),
                  "force-sync" === e.type &&
                    (log("Otrzymano rozkaz synchronizacji...", "info"),
                    directorConn.send({ type: "get-obs-list" })),
                  handleRemoteCommand(e));
              }))
            : callSingleOBS(e, t, n, o),
          window.addEventListener("beforeunload", () => {
            (directorConn &&
              directorConn.open &&
              directorConn.send({ type: "leave" }),
              globalConn &&
                globalConn.open &&
                globalConn.send({ type: "leave" }));
          }));
      }
      function regenerateLink() {
        generateMonitorLink(
          document.getElementById("target-id").value,
          document.getElementById("username").value.trim(),
        );
      }
      function generateMonitorLink(e, t) {
        const n = document.getElementById("btn-open-monitor");
        let o = window.location.href.split("guest.html")[0],
          a = `?room=${e}`;

              r.send({ type: "mic-status", muted: e }),
              r.send({
                type: "guest-cam-transform",
                transform: currentTransform,

              isMulti ||
                (log("Połączenie zestawione!", "success"),
                (document.getElementById("join-btn").innerText =
                  "JESTEŚ NA WIZJI"),
                (document.getElementById("join-btn").style.background =
                  "#dc3545"),
                (document.getElementById("monitor-area").style.display =
                  "block")));
          }),
          a.on("close", () => {
            const t = activeCallIds.indexOf(e);
            t > -1 && activeCallIds.splice(t, 1);
            const n = activeCalls.indexOf(a);
            n > -1 && activeCalls.splice(n, 1);
          }),
          a.on("error", () => {
            const t = activeCallIds.indexOf(e);

            const n = activeCalls.indexOf(a);
            n > -1 && activeCalls.splice(n, 1);

          n &&
            setTimeout(() => {
              const e = a.peerConnection

      ((window.onload = async function () {

          ? ((document.getElementById("target-id").value = e),

  </body>
</html>
