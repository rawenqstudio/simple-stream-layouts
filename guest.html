      }
      label {

      }

      }

      }
      button#join-btn:disabled {

        color: var(--text-subtle);

        font-weight: 600;

      }

        height: 45px;
        display: block;
      }

        transform: scale(1.05);
      }

          <span>🔥 Unlock Bitrate (6 Mbps)</span></label

      <div class="settings-group">
        <label

      </div>

      <input type="text" id="target-id" />

      <button id="join-btn" onclick="joinRoom()" disabled="disabled">
        Ładowanie kamery...

      <!-- PODGLĄDY DLA GOŚCIA -->
      <div id="monitor-area">

            margin: 0 0 12px 0;

            font-size: 12.5px;

        <div style="display: flex; gap: 8px; flex-direction: column">
          <button id="btn-monitor-local" class="btn-monitor btn-monitor-local">
            📋 Skopiuj Własny Podgląd (Niezależny)
          </button>
          <button id="btn-monitor-director" class="btn-monitor btn-monitor-dir">
            📋 Skopiuj Podgląd Live Reżysera (Tryb gry)
          </button>
        </div>
      </div>

      <div id="logs"></div>
    </div>

                  (joinBtn.style.color = "#fb7185"),
                  (joinBtn.style.boxShadow =
                    "0 0 15px rgba(244, 63, 94, 0.25)"),
                  (document.getElementById("monitor-area").style.display =
                    "block")),
                  "force-sync" === e.type &&
                    (log("Otrzymano rozkaz synchronizacji...", "info"),
                    directorConn.send({ type: "get-obs-list" })),
                  handleRemoteCommand(e));
              }))
            : callSingleOBS(e, t, n, o),
          window.addEventListener("beforeunload", () => {
            (directorConn &&
              directorConn.open &&
              directorConn.send({ type: "leave" }),
              globalConn &&
                globalConn.open &&
                globalConn.send({ type: "leave" }));
          }));
      }
      function copyWithFeedback(btn, text) {
        navigator.clipboard
          .writeText(text)
          .then(() => {
            const originalText = btn.innerText;
            const originalBg = btn.style.background;
            const originalBorder = btn.style.borderColor;
            const originalColor = btn.style.color;
            btn.innerText = "✅ Skopiowano link!";
            btn.style.background = "rgba(16, 185, 129, 0.25)";
            btn.style.borderColor = "rgba(16, 185, 129, 0.4)";
            btn.style.color = "#34d399";
            setTimeout(() => {
              btn.innerText = originalText;
              btn.style.background = originalBg;
              btn.style.borderColor = originalBorder;
              btn.style.color = originalColor;
            }, 2000);
          })
          .catch(() => {
            alert("Twój link to:\n" + text);
          });
      }

      function generateMonitorLink(e, t) {
        let o = window.location.href.split("guest.html")[0];
        let baseParams = `?room=${e}`;
        if (useStunOnly) baseParams += "&stunonly=1";
        if (urlParams.get("ull")) baseParams += "&ull=1";
        if (isMulti) baseParams += "&multi=1";

        const localUrl = `${o}obs.html${baseParams}${t ? `&exclude=${encodeURIComponent(t)}` : ""}&local=1`;
        const directorUrl = `${o}obs.html${baseParams}`;

        const btnLocal = document.getElementById("btn-monitor-local");
        const btnDirector = document.getElementById("btn-monitor-director");

        if (btnLocal)
          btnLocal.onclick = () => copyWithFeedback(btnLocal, localUrl);
        if (btnDirector)
          btnDirector.onclick = () =>
            copyWithFeedback(btnDirector, directorUrl);
      }
      function callSingleOBS(e, t, n, o) {
        (log(`Dzwonię do ekranu: ${e}`), activeCallIds.push(e));
        const a = peer.call(e, localStream);
        activeCalls.push(a);
        const r = peer.connect(e);
        (isMulti || (globalConn = r),
          r.on("open", () => {
            const e = document.getElementById("start-muted").checked;
            (r.send({ type: "identify", name: t, ratio: o }),
              r.send({ type: "mic-status", muted: e }),
              r.send({
                type: "guest-cam-transform",
                transform: currentTransform,
              }),
              isMulti ||
                (log("Połączenie zestawione!", "success"),
                (document.getElementById("join-btn").innerText =
                  "🔴 JESTEŚ NA WIZJI"),
                (document.getElementById("join-btn").style.background =
                  "rgba(244, 63, 94, 0.2)"),
                (document.getElementById("join-btn").style.border =
                  "1px solid rgba(244, 63, 94, 0.4)"),
                (document.getElementById("join-btn").style.color = "#fb7185"),
                (document.getElementById("join-btn").style.boxShadow =
                  "0 0 15px rgba(244, 63, 94, 0.25)"),
                (document.getElementById("monitor-area").style.display =
                  "block")));
          }),
          a.on("close", () => {
            const t = activeCallIds.indexOf(e);
            t > -1 && activeCallIds.splice(t, 1);
            const n = activeCalls.indexOf(a);
            n > -1 && activeCalls.splice(n, 1);
          }),
          a.on("error", () => {
            const t = activeCallIds.indexOf(e);
            t > -1 && activeCallIds.splice(t, 1);
            const n = activeCalls.indexOf(a);
            n > -1 && activeCalls.splice(n, 1);
          }),
          n &&
            setTimeout(() => {
              const e = a.peerConnection
                .getSenders()
                .find((e) => "video" === e.track.kind);
              if (e) {
                const t = e.getParameters();
                (t.encodings || (t.encodings = [{}]),
                  (t.encodings[0].maxBitrate = 6e6),
                  e
                    .setParameters(t)
                    .then(() => {})
                    .catch((e) => {}));
              }
            }, 1e3),
          r.on("data", (e) => handleRemoteCommand(e)),
          setInterval(() => {
            r.open && r.send({ type: "heartbeat" });
          }, 2e3));
      }
      function handleRemoteCommand(e) {
        if ("mute-cmd" === e.type) {
          const t = localStream.getAudioTracks()[0];
          if (t) {
            ((t.enabled = !e.state),
              toggleMuteUI(e.state),
              (document.getElementById("start-muted").checked = e.state));
            const n = { type: "mic-status", muted: e.state };
            (directorConn && directorConn.open && directorConn.send(n),
              globalConn && globalConn.open && globalConn.send(n));
          }
        }
      }
      ((window.onload = async function () {
        try {
          const savedName = localStorage.getItem("ssl_guest_name");
          if (savedName) document.getElementById("username").value = savedName;
        } catch (err) {}
        document
          .getElementById("username")
          .addEventListener("input", function () {
            this.style.border = "1px solid #555";
          });
        const e = urlParams.get("room");
        e
          ? ((document.getElementById("target-id").value = e),
            log(`Pokój wykryty: ${e}`),
            (joinBtn.disabled = !0),
            (joinBtn.innerText = "Inicjalizacja..."),
            await requestPermissions(),
            await getDevices(),
            startPreview(),
            updateTransform())
          : (log("BŁĄD: Brak ID pokoju w linku.", "error"),
            (joinBtn.disabled = !0),
            (joinBtn.innerText = "BŁĘDNY LINK"));
      }),
        document
          .getElementById("start-muted")
          .addEventListener("change", checkMuteState),
        peer.on("open", (e) => log(`Gotowy. Twoje ID: ${e}`, "success")));
    </script>
  </body>
